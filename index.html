  X.syncTenure(); const g = S.chr.mgr, v = X.mgrScore(), cnt = n => S.trophies.filter(t => t.n === n).length;
  const all = HOF_COACH.map(x => ({ n: x[0], o: x[1], v: x[2], d: x[3] })).concat(allAI().map(t => X.coachOf(t)).filter(k => k.tro >= 2).map(k => ({ n: k.n, o: NATS[k.nat] ? NATS[k.nat].n : '', v: k.tro * 70 + k.rep * 3, d: k.tro + ' titres de champion' }))).concat([{ n: coachN(), o: S.club.name, v, d: S.trophies.length + ' trophées', me: 1 }]).sort((a, b) => b.v - a.v).slice(0, 15);
  const dev = Object.values(S.chr.pl).filter(e => e.yth || (e.ovM || 0) - (e.ov0 || 99) >= 8).length;
  return `<div class="grid g2"><div class="panel chr-mgr"><div class="prev">${safe(() => coachSVG(S.coach), '')}<div><h3>${esc(coachN())}</h3><p class="gold">${X.mgrTier(v)}</p>${tg(num(v) + ' points de prestige', 'g')}${S.chr.mhof ? ' ' + tg('👔 Hall of Fame · ' + yLab(S.chr.mhof), 'v') : ''}</div></div>
${stat('Réputation', Math.min(100, v / 12), 'gd')}<div class="kv" style="margin-top:8px"><span>Saisons</span><b>${S.hist.length + (S.ended ? 0 : 1)}</b><span>Matchs</span><b>${S.rec.w + S.rec.d + S.rec.l}</b><span>Victoires · nuls · défaites</span><b>${S.rec.w} · ${S.rec.d} · ${S.rec.l}</b><span>Taux de victoire</span><b>${S.rec.w + S.rec.d + S.rec.l ? Math.round(S.rec.w / (S.rec.w + S.rec.d + S.rec.l) * 100) : 0} %</b><span>Trophées</span><b>${S.trophies.length}</b><span>Champions League</span><b>${cnt('Champions League')}</b><span>Clubs entraînés</span><b>${g.cl.length}</b><span>Joueurs développés</span><b>${dev}</b><span>Records du monde</span><b>${g.wr || 0}</b><span>Valeur historique</span><b class="gold">${X.mgrTier(v)}</b></div>
<button class="btn gold" style="margin-top:14px" data-a="chrCareer">🎬 Bilan de carrière</button></div>
<div class="panel"><h3>Clubs entraînés</h3>${g.cl.slice().reverse().map(x => { const w = (x.end ? x.w1 : S.rec.w) - x.w0, d = (x.end ? x.d1 : S.rec.d) - x.d0, l = (x.end ? x.l1 : S.rec.l) - x.l0, t = (x.end ? x.t1 : S.trophies.length) - x.t0; return `<div class="li"><span class="chr-dot" style="background:${x.c1 || '#555'}"></span><span><b>${esc(x.n)}</b><br><small class="mut">${yLab(x.s0)} → ${x.end ? yLab(x.s1) : 'aujourd\'hui'}${x.sack ? ' · licencié' : ''}</small></span><span class="sp">${w} V · ${d} N · ${l} D${t ? '<br>' + tg('🏆 ' + t, 'g') : ''}</span></div>`; }).join('')}
<h3 style="margin-top:16px">Hall of Fame des managers</h3><table class="tb"><tr><th>#</th><th>Entraîneur</th><th>Prestige</th></tr>${all.map((x, i) => `<tr class="${x.me ? 'me' : ''}"><td>${i + 1}</td><td>${esc(x.n)}<br><small class="mut">${esc(x.o)} · ${esc(x.d)}</small></td><td><b>${num(x.v)}</b></td></tr>`).join('')}</table><p class="mut" style="margin-top:6px">Entrée au Hall of Fame à 700 points de prestige : victoires, trophées pondérés, joueurs révélés, records et légendes formées.</p></div></div>`;
}
function careerModal() {
  const v = X.mgrScore(), g = S.chr.mgr, ms = (S.chr.mom || []).slice(0, 5);
  modal(`<div class="chr-car"><p class="bye-k">Bilan de carrière</p>${safe(() => `<div class="chr-car-co">${coachSVG(S.coach)}</div>`, '')}<h2>${esc(coachN())}</h2><p class="gold">${X.mgrTier(v)} · ${num(v)} points de prestige</p>
<div class="bye-st"><div><b class="num">${S.hist.length + (S.ended ? 0 : 1)}</b><small>saisons</small></div><div><b class="num">${S.rec.w}</b><small>victoires</small></div><div><b class="num">${S.trophies.length}</b><small>trophées</small></div><div><b class="num">${g.cl.length}</b><small>club${g.cl.length > 1 ? 's' : ''}</small></div></div>
${ms.length ? `<h3 style="margin:12px 0 6px">Ses plus grandes soirées</h3>${ms.map(m => `<div class="li"><span>${m.i}</span><span><b>${esc(m.t)}</b><br><small class="mut">${esc(m.d)} · ${esc(m.club || '')}</small></span></div>`).join('')}` : ''}
<p class="mut" style="margin-top:12px">${S.chr.mhof ? 'Membre du Hall of Fame des managers depuis ' + yLab(S.chr.mhof) + '.' : 'Encore ' + num(Math.max(0, 700 - v)) + ' points de prestige pour entrer au Hall of Fame.'} Votre partie continue : ce bilan se met à jour à chaque saison.</p></div>`, true);
}

/* =====================================================================
   FICHE JOUEUR : histoire avec le coach, identité des jeunes
   ===================================================================== */
function storyHTML(p) {
  const own = !!pById(p.id) || (S.acad && S.acad.ys.includes(p)); if (!own && !(p.mem && p.mem.length) && !p.bio) return '';
  X.initP(p); const r = relTxt(p.rel || 0), q = quoteOf(p), b = p.bio;
  return `<div class="chr-story"><h3 style="margin:12px 0 6px">📖 ${own ? 'Histoire avec le coach' : 'Passé au club'}</h3>
${b ? `<div class="chr-bio"><div class="row" style="gap:6px">${tg(ARCH[b.a][1] + ' ' + ARCH[b.a][0], 'g')}${stars(X.starsOf(p))}${tg('Personnalité : ' + CHAR[chOf(p)][0].toLowerCase())}</div><p>${esc(b.st || '')}</p><small class="mut">Idole : ${esc(b.idol)} · Origine : ${esc(b.town)}</small></div>` : ''}
${own ? `<div class="kv"><span>Relation avec le coach</span><b class="${r[1]}">${r[0]} (${p.rel > 0 ? '+' : ''}${Math.round(p.rel || 0)})</b><span>Loyauté</span><b>${loyTxt(p.loy)} · ${Math.round(p.loy)}</b><span>Volonté de rester</span><b class="${p.req ? 'bad' : p.loy >= 62 ? 'ok' : ''}">${p.req ? 'Veut partir' : p.loy >= 80 ? 'Totale' : p.loy >= 55 ? 'Forte' : p.loy >= 35 ? 'Incertaine' : 'Faible'}</b></div>` : ''}
${q ? `<blockquote class="chr-q">« ${esc(q)} »<cite>${esc(p.n)}</cite></blockquote>` : ''}
${p.mem && p.mem.length ? `<ol class="chr-mem">${p.mem.slice().reverse().map(m => `<li><i aria-hidden="true">${MEMI[m.k] || '•'}</i><span>${esc(m.t)}<small>${esc(m.d || 'saison ' + m.s)}</small></span></li>`).join('')}</ol>` : '<p class="mut">Aucun souvenir marquant pour l\'instant : son histoire avec le club reste à écrire.</p>'}</div>`;
}
wrap('playerModal', o => function (id) {
  const r = o.apply(this, arguments);
  safe(() => { const p = anyP(id) || (S.acad && S.acad.ys.find(y => y.id === id)); const box = $('#modal .pm > div:last-child'); if (!p || !box || box.querySelector('.chr-story')) return; const h = storyHTML(p); if (!h) return; const row = [...box.children].filter(x => x.classList && x.classList.contains('row')).pop(); if (row) row.insertAdjacentHTML('beforebegin', h); else box.insertAdjacentHTML('beforeend', h); });
  return r;
});
wrap('card', o => function (p) {
  const h = o.apply(this, arguments);
  return p && p.bio && S.acad && S.acad.ys.includes(p) ? h.replace('<h4>', `<div class="chr-yb" title="${esc(ARCH[p.bio.a][2])}">${ARCH[p.bio.a][1]} ${ARCH[p.bio.a][0]} · ${'★'.repeat(X.starsOf(p))}</div><h4>`) : h;
});
// Académie : les fiches des jeunes s'ouvrent au clic (lecture de leur histoire).
document.addEventListener('click', e => { const el = e.target.closest && e.target.closest('.chr-yb'); if (!el) return; const art = el.closest('article'); const btn = art && art.querySelector('[data-id]'); if (btn) { e.stopPropagation(); youthModal(+btn.dataset.id); } }, true);
function youthModal(id) {
  const p = S.acad.ys.find(y => y.id === id); if (!p) return;
  modal(`<div class="pm"><div>${card(p, { j: myCol() })}</div><div><h2>${esc(p.n)}</h2><p class="mut">${p.age} ans · ${POS[p.pos].n} · centre de formation</p>${storyHTML(p)}<div class="row" style="margin-top:14px"><button class="btn gold" data-a="yPro" data-id="${p.id}">Promouvoir</button></div></div></div>`, true);
}

/* =====================================================================
   AVANT-MATCH : les anciens joueurs n'ont rien oublié
   ===================================================================== */
wrap('preMatch', o => function () {
  const r = o.apply(this, arguments);
  safe(() => {
    const op = S.opp, w = mEl().querySelector('.mw'); if (!op || !w || w.querySelector('.chr-ex') || op.tk == null) return;
    const t = teamByK(op.tk); if (!t) return; const ex = sqOf(t).filter(p => p.mem && p.mem.some(m => m.k === 'sold' || m.k === 'free')).slice(0, 3); if (!ex.length) return;
    if (!op.chrX) { op.chrX = 1; if (ex.some(p => p.grudge)) op.form = Math.min(100, (op.form || 60) + 4); }
    const box = `<div class="panel chr-ex" style="margin-top:12px"><h3>🔁 Retrouvailles <small>anciens joueurs du club dans l'effectif adverse</small></h3>${ex.map(p => { const q = quoteOf(p); return `<div class="li">${ava(p, 34)}<span><b>${esc(p.n)}</b> · ${p.pos} ${ovr(p)}<br><small class="mut">${esc((p.mem.filter(m => m.k === 'sold' || m.k === 'free').pop() || {}).t || '')}</small>${q ? `<br><em class="chr-qi">« ${esc(q)} »</em>` : ''}</span>${p.grudge ? tg('😤 Revanchard', 'r') : ''}</div>`; }).join('')}${ex.some(p => p.grudge) ? '<p class="mut" style="margin-top:6px">Un ancien joueur revanchard galvanise l\'adversaire : forme +4.</p>' : ''}</div>`;
    const rows = w.querySelectorAll(':scope > .row'); const last = rows[rows.length - 1]; if (last) last.insertAdjacentHTML('beforebegin', box);
  });
  return r;
});

/* =====================================================================
   STADE : évolution visuelle et économie du jour de match
   ===================================================================== */
wrap('stadSVG', o => function (l) {
  let s = o.apply(this, arguments); if (!S || !S.chr) return s;
  return safe(() => {
    const F = S.chr.fac, c1 = S.club.c1, c2 = S.club.c2; let a = '';
    if (l >= 5) a += `<ellipse cx="260" cy="150" rx="${118 + l * 24 + 10}" ry="${68 + l * 15 + 8}" fill="none" stroke="rgba(160,200,255,.35)" stroke-width="3" stroke-dasharray="2 6"/>`;
    if (F.led) [[20, 20], [500, 20], [20, 280], [500, 280]].forEach(([x, y]) => a += `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" fill="#fff" opacity=".95"/><circle cx="${x}" cy="${y}" r="26" fill="#cfe6ff" opacity=".22"/>`);
    if (F.scr) [[70, 12], [380, 12]].forEach(([x, y]) => a += `<rect x="${x}" y="${y}" width="70" height="26" rx="3" fill="#05080f" stroke="${c2}" stroke-width="2"/><text x="${x + 35}" y="${y + 18}" text-anchor="middle" font-size="12" font-weight="800" fill="${c2}" font-family="Barlow Condensed,Arial Narrow,sans-serif">${esc(String(S.club.name).slice(0, 10).toUpperCase())}</text>`);
    if (F.vip) a += `<rect x="215" y="${100 - 6 - l * 15 - 20}" width="90" height="9" rx="2" fill="#f8e19a" opacity=".85"/>`;
    if (F.roof) a += `<ellipse cx="260" cy="150" rx="${118 + l * 24 + 2}" ry="${68 + l * 15 + 2}" fill="rgba(200,220,255,.07)" stroke="rgba(230,240,255,.55)" stroke-width="5"/>`;
    if (F.mus) a += `<rect x="470" y="236" width="38" height="40" rx="3" fill="#0b1328" stroke="${c1}" stroke-width="2"/><text x="489" y="261" text-anchor="middle" font-size="16">🏛️</text>`;
    return s.replace('</svg>', a + '</svg>');
  }, s);
});
const P0stad = P.stadium;
P.stadium = () => {
  let h = P0stad(); if (!S.chr) return h;
  return safe(() => {
    const F = S.chr.fac, ec = econ(), st = STAD[S.stad], pr = X.stadPrestige(), am = X.stadAmb(), R = S.chr.rec;
    h = h.replace('<span class="mut">Niveau', `<span class="mut">${STAD_N[S.stad]} · Niveau`);
    const evo = `<div class="chr-evo" role="list">${STAD_N.map((n, i) => `<div role="listitem" class="${i < S.stad ? 'ok' : i === S.stad ? 'on' : ''}"><b>${n}</b><small>${num(STAD[i].cap)} places</small></div>`).join('')}</div>`;
    const fac = Object.entries(FAC).map(([k, f]) => { const own = !!F[k], lock = S.stad + 1 < f.st ? 'Stade niveau ' + f.st : f.tro && !S.trophies.length ? 'Un trophée requis' : ''; return `<div class="chr-fac${own ? ' own' : ''}"><i aria-hidden="true">${f.i}</i><b>${f.n}</b><small>${f.d}</small><span class="mut">Entretien ${eur(f.up)}/match · prestige +${f.pr}${f.am ? ' · ambiance +' + f.am : ''}</span>${own ? tg('✓ Construit en ' + yLab(F[k]), 'v') : `<button class="btn sm${lock ? '' : ' gold'}" data-a="chrFac" data-k="${k}"${lock ? ' disabled' : ''}>${lock || 'Construire · ' + eur(f.c)}</button>`}</div>`; }).join('');
    const panel = `<div class="grid g2" style="margin-top:16px"><div class="panel"><h3>Jour de match <small>${num(st.cap)} places</small></h3><div class="kv"><span>Affluence attendue</span><b>${num(ec.att)} (${Math.round(ec.att / st.cap * 100)} %)</b>${F.abo ? `<span>Abonnés</span><b>${num(ec.abo || 0)}</b>` : ''}<span>Prix du billet</span><b>${ec.price} €</b><span>Billetterie</span><b class="ok">${eur(ec.tk0 != null ? ec.tk0 : ec.ticket)}</b>${ec.food ? `<span>Restauration</span><b class="ok">${eur(ec.food)}</b>` : ''}${ec.vip ? `<span>Loges VIP</span><b class="ok">${eur(ec.vip)}</b>` : ''}<span>Boutique</span><b class="ok">${eur(ec.merch)}</b><span>Record d'affluence</span><b>${R.att ? num(R.att) + (R.attO ? ' · contre ' + esc(R.attO) : '') : '–'}</b></div>
${stat('Ambiance', am, am >= 60 ? 'gr' : '')}${stat('Prestige', pr, 'gd')}<p class="mut" style="margin-top:6px">L'affluence suit la ferveur, la forme des 5 derniers matchs et le prestige de l'enceinte.${S.chr.aboS && S.chr.aboS.s === S.season ? ' Campagne d\'abonnements : ' + num(S.chr.aboS.n) + ' abonnés, ' + eur(S.chr.aboS.amt) + ' encaissés.' : ''}</p></div>
<div class="panel"><h3>Évolution du stade</h3>${evo}<p class="mut" style="margin-top:8px">Chaque agrandissement transforme l'enceinte. Les aménagements ci-dessous la font vivre.</p></div>
<div class="panel" style="grid-column:1/-1"><h3>Aménagements <small>${Object.keys(F).length} / ${Object.keys(FAC).length}</small></h3><div class="chr-facs">${fac}</div></div></div>`;
    return h + panel;
  }, h);
};

/* =====================================================================
   MÉDIAS : rubriques, citations, filtres
   ===================================================================== */
const P0media = P.media;
P.media = () => {
  if (tabOf('md', 'press') !== 'press' || !S.chr) return P0media();
  return safe(() => {
    const f = UI.mdc || 'all', list = (S.news || []).filter(a => f === 'all' || (a.c || 'MATCH') === f), used = [...new Set((S.news || []).map(a => a.c || 'MATCH'))];
    const pq = S.pq ? `<div class="panel" style="border-color:var(--gold);margin-bottom:14px"><h3>🎤 Conférence de presse</h3><p class="mut">Les journalistes attendent votre réaction au dernier match. Sans réponse avant le prochain, les supporters vous le reprocheront.</p><button class="btn gold" data-a="pqM">Répondre aux journalistes</button></div>` : '';
    const chips = `<div class="row chr-chips" style="gap:6px;margin-bottom:12px"><button class="tab${f === 'all' ? ' on' : ''}" data-a="chrMdc" data-v="all">Toute l'actualité</button>${used.map(k => `<button class="tab${f === k ? ' on' : ''}" data-a="chrMdc" data-v="${k}">${(CATS[k] || CATS.MATCH)[0]} ${(CATS[k] || CATS.MATCH)[1].toLowerCase()}</button>`).join('')}</div>`;
    const arts = list.map(a => { const C2 = CATS[a.c || 'MATCH'] || CATS.MATCH; return `<article class="art ${a.k} chr-art c-${(a.c || 'MATCH').toLowerCase()}"><small>${esc(a.j)} · ${a.d ? esc(a.d) : 'saison ' + a.s}</small><span class="chr-catb">${C2[0]} ${C2[1]}</span><h4>${esc(a.t)}</h4><p>${esc(a.x)}</p>${a.q ? `<blockquote class="chr-q">« ${esc(a.q)} »</blockquote>` : ''}</article>`; }).join('');
    return `<div class="ph"><h2>Médias</h2><span class="mut">Presse, tribunes et direction</span></div>${tabs('md', [['press', 'Presse'], ['fans', 'Tribunes'], ['board', 'Direction']])}${pq}${chips}${arts || '<div class="empty">Aucun article dans cette rubrique pour le moment.</div>'}`;
  }, P0media());
};

/* =====================================================================
   COACH : accès à la carrière ; ACCUEIL : à la une
   ===================================================================== */
const P0coach = P.coach;
P.coach = () => { const h = P0coach(); return safe(() => { const v = X.mgrScore(); return h + `<div class="panel" style="margin-top:16px"><h3>Carrière du manager <small>${X.mgrTier(v)}</small></h3><div class="row" style="justify-content:space-between"><span class="mut">${num(v)} points de prestige · ${S.trophies.length} trophée${S.trophies.length > 1 ? 's' : ''} · ${S.chr.mgr.cl.length} club${S.chr.mgr.cl.length > 1 ? 's' : ''}</span><button class="btn" data-a="chrGo" data-v="mgr">Voir la carrière</button></div></div>`; }, h); };
const P0home = P.home;
P.home = () => {
  const h = P0home(); return safe(() => {
    const a = (S.news || []).find(x => x.c && x.c !== 'MATCH'), m = (S.chr.mom || [])[0];
    if (!a && !m) return h;
    return h + `<div class="grid g2" style="margin-top:16px">${a ? `<div class="panel"><h3>À la une <small>${(CATS[a.c] || CATS.MATCH)[0]} ${(CATS[a.c] || CATS.MATCH)[1].toLowerCase()}</small></h3><b>${esc(a.t)}</b><p class="mut" style="margin-top:4px">${esc(a.x)}</p><button class="lnk gold" data-a="go" data-p="media">Toute la presse</button></div>` : ''}${m ? `<div class="panel"><h3>Dernier grand moment</h3><b>${m.i} ${esc(m.t)}</b><p class="mut" style="margin-top:4px">${esc(m.d)}</p><button class="lnk gold" data-a="chrGo" data-v="mom">L'histoire du club</button></div>` : ''}</div>`;
  }, h);
};

/* =====================================================================
   ACTIONS
   ===================================================================== */
Object.assign(A, {
  chrNext: () => { X.ovClose(); if (X.Q.length) setTimeout(() => { if (!X.ovOpen() && X.Q.length) X.ovShow(X.Q.shift()); }, 250); },
  chrMom: d => { const m = S.chr.mom[+d.i]; if (m) X.ovShow(m); },
  chrFac: d => { const e = X.buyFac(d.k); if (e) toast('⚠️ ' + e); else { toast('🏗️ ' + FAC[d.k].n + ' : travaux terminés.'); render(); } },
  chrMdc: d => { UI.mdc = d.v; render(); },
  chrWlf: () => { UI.wlf = UI.wlf === 'imp' ? 'all' : 'imp'; render(); },
  chrGo: d => { UI.tab.hi = d.v; go('history'); },
  chrCareer: () => careerModal()
});
if (A.byeDo) { const o = A.byeDo; A.byeDo = function () { const r = o.apply(this, arguments); safe(() => X.hofCheck()); return r; }; }
// Le panthéon d'origine (onglet Légendes des statistiques) renvoie vers le nouveau Panthéon.
wrap('legendsHTML', o => function () { const h = o.apply(this, arguments); return `<div class="panel" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><span>🏛️ Le Panthéon complet du club : cartes des légendes, records, moments et histoire de chaque joueur.</span><button class="btn gold sm" data-a="chrGo" data-v="hof">Ouvrir le Panthéon</button></div></div>` + h; });
// L'assistante connaît la nouvelle page.
safe(() => { if (typeof SEC_PG !== 'undefined' && !SEC_PG.some(x => x[1] === 'history')) SEC_PG.unshift(['histoire|pantheon|legende|record', 'history']); });
safe(() => { if (typeof secPage === 'function') { const o = secPage; window.secPage = function (p) { if (p === 'history') { const m = (S.chr.mom || [])[0]; return m ? 'Dernier grand moment : ' + esc(m.t) + '.' : 'Ici s\'écrit l\'histoire du club, coach.'; } return o.apply(this, arguments); }; } });
})();

</script>
<style>
/* ===== AMBIANCE DE MATCH : temps forts, VAR, météo, bancs, avant-match ===== */
.momw{background:#0c1630;border:1px solid #182646;border-radius:10px;padding:7px 10px 6px;margin-bottom:10px}
.momw-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.momw-h b{color:var(--text);letter-spacing:0;text-transform:none;font-size:12.5px;text-align:right}
.momg{position:relative;height:8px;border-radius:4px;overflow:hidden}
.momg::after{content:"";position:absolute;left:50%;top:0;height:3px;width:2px;margin-left:-1px;background:#04060c}
.momg{background:linear-gradient(90deg,#ff9aa6,var(--bad))}
.momg i{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-right:2px solid #04060c;transition:width .4s ease}
.momc{position:relative;height:38px;margin-top:6px}
.momc svg{display:block;width:100%;height:100%}
.momc .mu{fill:var(--gold)}.momc .mo{fill:var(--bad)}
.momc .gm{position:absolute;transform:translate(-50%,-50%);font-size:10px;line-height:1}
.momc .gm.u{top:4px}.momc .gm.o{top:34px}

<script>
/* =====================================================================
   AMBIANCE DE MATCH — public qui réagit au jeu, temps forts et temps
   faibles, VAR avec suspense, avant-match (entrée des joueurs, hymne,
   compositions, affluence), météo visible, arrêts de jeu annoncés,
   vibrations, fin de match sous tension, bancs et entraîneurs.
   Ce module s'ajoute par-dessus le moteur : il enveloppe les fonctions
   d'origine. Le moteur l'appelle en deux points de liveMinute :
   liveMom (élan des équipes) et livePlus (événements d'ambiance).
   ===================================================================== */
(function () {
'use strict';
const safe = (f, d) => { try { return f(); } catch (e) { if (window.console) console.warn('[Ambiance]', e); return d; } };
const wrapF = (name, f) => { const o = window[name]; if (typeof o === 'function') window[name] = f(o); };
const VIB = p => safe(() => { if (S && S.set.vib !== false && navigator.vibrate) navigator.vibrate(p); });
/** Part du stade acquise au camp s (0 : le club, 1 : l'adversaire). */
const fanShare = s => { const L = M.L; return !L || L.hU === 2 ? .55 : (s === 0) === (L.hU === 1) ? 1 : .2; };
const SLIP = { rain: 'détrempée', snow: 'enneigée', mud: 'grasse' };
const still = () => !S.set.anim || !!(window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches);
const XS = L => L.x || (L.x = { boo: 0, said: -99, run: 0, sgn: 0, long: 0, bn: 0, gk: 0, late: 0, dr: 0 });
/** Affluence du jour, fixée une fois pour toutes pour ce match. */
function attOf(o) {
  if (o.att && o.att.n) return o.att;
  let n, cap;
  if (o.home && !o.neutral) { cap = STAD[S.stad].cap; n = Math.min(cap, Math.round(econ().att * (o.derby ? 1.15 : 1))); }
  else {
    cap = o.neutral ? 60000 : STAD[clamp(Math.floor(((o.a + o.m + o.d) / 3 - 52) / 6), 0, STAD.length - 1)].cap;
    n = Math.round(cap * (o.derby || o.neutral ? R(.93, 1) : R(.7, .98)));
  }
  return o.att = { n, cap };
}

/* ---------------------------------------------------------------------
   MOTEUR : élan des équipes (temps forts, temps faibles)
   L.mom va de −100 (l'adversaire étouffe le club) à +100 (le club domine).
   --------------------------------------------------------------------- */
window.liveMom = function (xu, xo) {
  try {
    const L = M.L; if (L.mom == null) { L.mom = 0; L.momH = []; L.momW = 0; }
    L.ev0 = L.ev.length; L.momP = L.mom;
    const base = clamp((xu - xo) / (xu + xo) * 85, -55, 55);                  // rapport de forces du moment
    L.momW = clamp(L.momW * .9 + R(-20, 20), -55, 55);                         // vagues : un match n'est jamais linéaire
    L.mom = clamp(L.mom + (base + L.momW - L.mom) * .24 + (L.momK || 0), -100, 100); L.momK = 0;
    L.momH.push(Math.round(L.mom));
    const k = L.mom / 100 * .16;                                               // l'équipe qui pousse se crée plus d'occasions
    return [(1 + k) * (L.drama ? 1.1 : 1), (1 - k) * (L.drama ? 1.12 : 1)];    // mené en fin de match : tout le monde monte, les contres s'ouvrent
  } catch (e) { return [1, 1]; }
};
window.livePlus = function (m) { safe(() => plus(m)); };

function lastCorner(m) {
  const L = M.L, o = L.o, gk = pById(S.xi[0]), tk = taker('co'); L.st.corners[0]++;
  lev(m, 'cor', 0, '🧤', 'Dernier corner ! ' + (gk ? gk.n + ' quitte ses buts et monte' : 'Tout le monde monte') + ' dans la surface adverse !'); L.ev[L.ev.length - 1].gk = 1;
  const x = rnd();
  if (x < .09) {
    const byGk = gk && rnd() < .3, h = byGk ? gk : livePick((q, l) => ({ A: 3, M: 1, D: 3, G: 0 }[l]) * q.d[4]);
    if (h) return liveGoal(0, n => byGk ? 'BUT !!! ' + n + ', LE GARDIEN, égalise de la tête au bout du temps additionnel !' : 'BUT !!! ' + n + ' égalise sur le dernier corner, le banc envahit la pelouse !', h, tk && tk.id !== h.id ? tk : null);
  }
  if (x < .2 && gk) return liveGoal(1, n => 'Contre éclair dans le but vide : ' + n + ' scelle la victoire de ' + o.name + '.');
  lev(m + .3, 'ch', 0, '⚡', pick(['La tête passe au-dessus : c\'était la dernière occasion.', 'La défense de ' + o.name + ' se dégage, l\'arbitre regarde sa montre…', 'Le gardien de ' + o.name + ' boxe le ballon des deux poings !']));
}
function slip(m) {
  const L = M.L, o = L.o, W = wxOf(o), gr = SLIP[o.wx];
  if (rnd() < .5) {
    const p = livePick((q, l) => ({ A: .5, M: 1.5, D: 3, G: .3 }[l])); if (!p) return;
    if (rnd() < .2) { lrt(p.id, -.4); return liveGoal(1, n => p.n + ' glisse sur la pelouse ' + gr + ', ' + n + ' en profite et marque pour ' + o.name + '.'); }
    lev(m + .2, 'slip', 0, W.i, p.n + ' glisse au moment de ' + pick(['relancer', 'contrôler le ballon', 'tacler']) + ' : ' + pick(['plus de peur que de mal.', 'la défense se rattrape de justesse.', 'le ballon file en touche.']));
  } else {
    if (rnd() < .2) { const a = liveAtt(); if (a) return liveGoal(0, n => 'BUT ! Un défenseur de ' + o.name + ' glisse sur la pelouse ' + gr + ', ' + n + ' n\'en demandait pas tant !', a); }
    lev(m + .2, 'slip', 1, W.i, pick(['Passe en retrait de ' + o.name + ' freinée par la pelouse ' + gr + ' : leur gardien dégage en catastrophe.', 'Un joueur de ' + o.name + ' part à la faute en glissant : le ballon est rendu.', 'Contrôle manqué côté ' + o.name + ' : le ballon fuse sur la pelouse ' + gr + '.']));
  }
}
function plus(m) {
  const L = M.L, o = L.o, X = XS(L), club = S.club.name, r = m - L.a1, evs = L.ev.slice(L.ev0 == null ? L.ev.length : L.ev0);
  const home = L.hU === 1, away = L.hU === 0, h2 = !!L.htAt && m > L.htAt;
  const bench = (s, i, x) => { if (X.bn < 7) { X.bn++; lev(m + .45, 'bench', s, i, x); } };
  /* L'élan réagit aux actions de la minute. */
  let k = 0;
  evs.forEach(e => {
    if (e.t === 'ch' || e.t === 'post') k += e.s ? -7 : 7; else if (e.t === 'sv') k += e.s ? 5 : -5; else if (e.t === 'cor') k += e.s ? -3 : 3;
    else if (e.t === 'goal') k += e.s ? -14 : 14; else if (e.t === 'r') k += e.s ? 12 : -12;
  });
  L.momK = k;
  /* Un but : mérité ou contre le cours du jeu ? Réaction des tribunes et des bancs. */
  const g = evs.find(e => e.t === 'goal');
  if (g) {
    const v = g.s ? -L.momP : L.momP;
    if (v < -30) lev(m + .2, 'mom', g.s, '🎭', g.s ? 'Contre le cours du jeu ! ' + club + ' dominait, mais c\'est ' + o.name + ' qui marque.' : 'Contre le cours du jeu ! ' + o.name + ' poussait, et c\'est ' + club + ' qui frappe.');
    else if (v > 34) lev(m + .2, 'mom', g.s, '📈', g.s ? 'But logique : ' + o.name + ' était en plein temps fort.' : 'But mérité : ' + club + ' poussait depuis plusieurs minutes.');
    if (g.s === 1 && home && rnd() < .65) lev(m + .25, 'fan', 0, '🤫', pick(['Silence glacé dans les tribunes.', 'Le stade se tait d\'un coup : on n\'entend plus que la joie des joueurs de ' + o.name + '.', 'Un froid tombe sur le stade.']));
    else if (g.s === 0 && away && rnd() < .65) lev(m + .25, 'fan', 0, '🤫', 'Le stade de ' + o.name + ' se tait d\'un coup : seul le parcage visiteurs exulte.');
    if (g.s === 0 && rnd() < .45) bench(1, '🗯️', pick(['Sur son banc, le coach de ' + o.name + ' est furieux contre sa défense.', 'Le coach de ' + o.name + ' jette sa bouteille d\'eau : il n\'a pas aimé ce marquage.', 'Bras écartés, le coach de ' + o.name + ' demande des comptes à ses défenseurs.']));
    else if (g.s === 1 && rnd() < .3) bench(1, '✊', pick(['Le coach de ' + o.name + ' serre le poing, puis réclame aussitôt du calme.', 'Tout le banc de ' + o.name + ' est debout.']));
  }
  if (evs.some(e => e.t === 'r' && e.s === 1) && rnd() < .6) bench(1, '🗯️', 'Le coach de ' + o.name + ' proteste vivement auprès du quatrième arbitre.');
  /* Temps fort qui dure, puis vent qui tourne. */
  const sg = L.mom > 28 ? 1 : L.mom < -28 ? -1 : 0;
  if (sg && sg === X.sgn) X.run++; else X.run = sg ? 1 : 0; X.sgn = sg;
  if (X.run === 8 && m - X.said > 11) {
    X.said = m; X.long = sg;
    lev(m + .6, 'mom', sg > 0 ? 0 : 1, '🌊', pick(sg > 0 ? [club + ' pousse depuis dix minutes : ' + o.name + ' ne sort plus de son camp.', 'Temps fort pour ' + club + ' : les vagues se succèdent devant le but adverse.', club + ' a pris le match à son compte, ' + o.name + ' subit.']
      : [o.name + ' pousse depuis dix minutes : ' + club + ' plie mais ne rompt pas.', 'Temps faible pour ' + club + ', incapable de ressortir le ballon.', 'On subit : ' + o.name + ' campe dans notre moitié de terrain.']));
  } else if (sg && X.long && sg === -X.long && X.run === 3) {
    X.long = 0; lev(m + .6, 'mom', sg > 0 ? 0 : 1, '🔄', sg > 0 ? 'Le vent tourne : ' + club + ' ressort enfin et reprend le contrôle du ballon.' : 'Le vent tourne : ' + o.name + ' relève la tête et s\'installe dans notre camp.');
  }
  /* Gain de temps : le public siffle. */
  if (h2 && r >= 76 && X.boo < 2 && m - (X.booAt || 0) > 5 && rnd() < .13) {
    X.booAt = m;
    if (L.b > L.a && !away) { X.boo++; lev(m + .65, 'boo', 1, '😤', pick(['Le gardien de ' + o.name + ' prend tout son temps pour dégager : bronca dans les tribunes !', o.name + ' joue la montre près du poteau de corner. Le public siffle.', 'Un joueur de ' + o.name + ' reste au sol… les sifflets descendent des tribunes.'])); }
    else if (L.a > L.b && away) { X.boo++; lev(m + .65, 'boo', 0, '😤', pick(['Vos joueurs gagnent du temps : le public de ' + o.name + ' siffle copieusement.', 'Remise en jeu qui traîne : tout le stade hue ' + club + '.'])); }
  }
  /* Fin de match sous tension : mené d'un but après la 85e minute. */
  const df = o.agg ? (L.a + o.agg[0]) - (L.b + o.agg[1]) : L.a - L.b, dr = h2 && r >= 85 && df === -1;
  if (dr) {
    if (!X.dr) { X.dr = 1; lev(m + .62, 'drama', 0, '🔥', club + ' n\'a plus que quelques minutes pour égaliser : tout le monde monte !'); }
    else if (rnd() < .45) lev(m + .62, 'drama', 0, '🔥', pick(['Ça pousse, ça pousse ! Encore un centre dans la surface de ' + o.name + ' !', 'Les défenseurs centraux sont montés aux avant-postes.', 'Long ballon devant, tout le monde à la retombée !', o.name + ' recule, recule… et dégage comme il peut.', 'Plus personne derrière : c\'est tout ou rien pour ' + club + ' !', 'Le chrono défile, le banc de ' + club + ' est debout.']));
    if (L.end90 && m === L.max) { const key = m > L.end90 ? 2 : 1; if (!(X.gk & key)) { X.gk |= key; lastCorner(m); } }
  }
  L.drama = dr;
  /* Pelouse glissante : pluie, neige ou terrain gras. */
  if (SLIP[o.wx] && rnd() < .028) slip(m);
  /* Bancs : échauffement et entraîneur adverse. */
  if (h2 && r === 50) {
    const ns = S.bench.map(pById).filter(p => p && !p.inj && !p.sus && p.pos !== 'GK').slice(0, 3).map(p => p.n);
    if (ns.length && L.subs < 5) lev(m + .7, 'bench', 0, '🏃', 'À l\'échauffement le long de la touche : ' + ns.join(', ') + '.');
  }
  if (h2 && r === 56 && L.ai.subs < 3) lev(m + .7, 'bench', 1, '🏃', 'Du mouvement sur le banc de ' + o.name + ' : deux joueurs partent s\'échauffer.');
  if (h2 && !X.late && r >= 80 && r <= 84 && L.b !== L.a && rnd() < .5) {
    X.late = 1; bench(1, L.b > L.a ? '⌚' : '📣', L.b > L.a ? 'Le coach de ' + o.name + ' montre sa montre à l\'arbitre : il veut entendre le coup de sifflet final.' : 'Le coach de ' + o.name + ' fait de grands gestes : il envoie tout le monde devant.');
  }
}

/* ---------------------------------------------------------------------
   VAR : un but sur huit environ est vérifié. Le score s'affiche, le jeu

.lk-bd{display:flex;flex-direction:column;gap:2px;min-width:150px;padding:8px 10px;border-radius:8px;background:#0f2a1e;border:3px solid #6b4b2a;font-size:12px;color:#e6f2ea;box-shadow:inset 0 0 18px rgba(0,0,0,.45)}
.lk-bd b{font-family:var(--disp);font-size:18px;color:#fff}
.lk-tip{margin-top:4px;color:#ffe08a}
.lk-bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:12px;padding:10px 8px 8px;border-radius:10px;background:linear-gradient(180deg,rgba(150,105,60,.35),rgba(90,60,30,.45));border-top:4px solid rgba(190,140,80,.55)}
.lk-p{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:11.5px;padding:4px 2px;border-radius:8px}
.lk-p b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.lk-p small{font-size:10.5px;color:var(--mut)}
.lk-p.kn{background:rgba(255,255,255,.08);box-shadow:0 0 0 1px rgba(214,31,44,.6)}
.lk-em{position:absolute;right:6px;top:0;font-size:15px;z-index:1}
.lk-en{display:block;width:80%;height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}.lk-en u{display:block;height:100%;text-decoration:none}
.lk-ft{margin-top:8px;font-size:12px}
@media (max-width:640px){.lk-staff{grid-template-columns:1fr}.lk-bd{min-width:0}}
@media (prefers-reduced-motion:reduce){.p2d em#pm{transition:none}}
</style>
<script>
'use strict';
/* =====================================================================
   MATCH EN DIRECT — vitesse, étiquette, placements, vestiaire, assistante
   ===================================================================== */
(() => {
const safe = (f, d) => { try { return f(); } catch (e) { if (window.console) console.warn('[Direct+]', e); return d; } };
const wrapF = (name, f) => { const o = window[name]; if (typeof o === 'function') window[name] = f(o); };
const live = () => { const L = M.L; return L && !L.done && !mEl().hidden ? L : null; };
const reg = L => Math.max(0, Math.floor(L.min) - (L.htAt && L.min > L.htAt ? L.a1 : 0));   // minute « réglementaire » (sans le temps additionnel de la 1re période)
const last = n => String(n || '').split(' ').slice(-1)[0];
const frPct = v => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(Math.round(v * 10) / 10).toString().replace('.', ',') + ' %';

/* ---------- 1. Vitesse modifiable pendant le match ---------- */
const SPD = [[4, '🐢 Lente'], [1, '▶ Normale'], [2, '⏩ Rapide']];
const spdLab = () => (SPD.find(x => x[0] === S.set.speed) || SPD[1])[1];
function spdBtn() {
  const pb = $('#mpb'); if (!pb || $('#mspd') || M.skip) return;
  pb.insertAdjacentHTML('afterend', `<button class="btn" id="mspd" data-a="mSpd" title="Vitesse du match (touche V)">${spdLab()}</button>`);
}
A.mSpd = () => {
  const i = SPD.findIndex(x => x[0] === S.set.speed); S.set.speed = SPD[(i + 1) % SPD.length][0]; save();
  const b = $('#mspd'); if (b) b.textContent = spdLab(); const el = $('#p2d'); if (el) el.style.setProperty('--t', liveTick() / 1000 + 's');
};
document.addEventListener('keydown', e => { if ((e.key === 'v' || e.key === 'V') && $('#mspd') && $('#modal').hidden && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) A.mSpd(); });

/* ---------- 2. Étiquette de l'action : placée là où elle ne cache personne ---------- */
function placeLabel() {
  const el = $('#p2d'), pm = $('#pm'), L = M.L; if (!el || !pm || pm.hidden || !L || !L.fx || L.fx.x == null) return;
  const W = el.clientWidth, H = el.clientHeight, w = pm.offsetWidth, h = pm.offsetHeight; if (!W || !H || !w) return;
  const x = L.fx.x / 100 * W, y = L.fx.y / 100 * H, g = 13, r = 10;
  const dots = [...el.querySelectorAll('i:not(.off)')].map(d => [parseFloat(d.style.left) / 100 * W, parseFloat(d.style.top) / 100 * H]).filter(d => !isNaN(d[0]) && !isNaN(d[1]));
  const C = [[x, y - h / 2 - g], [x, y + h / 2 + g], [x + w / 2 + g, y], [x - w / 2 - g, y], [x + w / 3, y - h / 2 - g], [x - w / 3, y - h / 2 - g], [x + w / 3, y + h / 2 + g], [x - w / 3, y + h / 2 + g]];
  let best = null, bs = Infinity;
  C.forEach(([cx, cy], k) => {
    cx = clamp(cx, w / 2 + 3, W - w / 2 - 3); cy = clamp(cy, h / 2 + 3, H - h / 2 - 3);
    let sc = k * 4 + Math.hypot(cx - x, cy - y) * .3;
    dots.forEach(([dx, dy]) => { const ox = Math.min(cx + w / 2, dx + r) - Math.max(cx - w / 2, dx - r), oy = Math.min(cy + h / 2, dy + r) - Math.max(cy - h / 2, dy - r); if (ox > 0 && oy > 0) sc += ox * oy * 3; });
    if (sc < bs) { bs = sc; best = [cx, cy]; }
  });
  if (best) { pm.style.left = (best[0] / W * 100).toFixed(2) + '%'; pm.style.top = (best[1] / H * 100).toFixed(2) + '%'; }
}

/* ---------- 3. Placements personnalisés en direct (glisser-déposer) ---------- */
const DR = { d: null };
const defH = i => 6 + (100 - FORM[S.formation][i][2]) * .5, defV = i => FORM[S.formation][i][1];
/** Effet du placement sur l'équipe : plus haut = plus d'attaque et moins de défense ; plus large = plus d'attaque, moins de milieu. */
function shapeOf(L) {
  const F = FORM[S.formation], c = L.cus || {}; let adv = 0, wid = 0, n = 0;
  for (let i = 1; i < 11; i++) { if (!S.xi[i]) continue; n++; const hx = c[i] ? c[i][0] : defH(i), hy = c[i] ? c[i][1] : defV(i); adv += hx - defH(i); wid += Math.abs(hy - 50) - Math.abs(defV(i) - 50); }
  if (!n || !Object.keys(c).length) return null;
  const a = clamp(adv / n / 8, -1, 1), w = clamp(wid / n / 8, -1, 1);
  const att = 4 * a + (w > 0 ? 1.5 * w : 2 * w), def = -3.5 * a, mid = w > 0 ? -1.5 * w : -2 * w;
  const r = v => Math.round(v * 10) / 10;
  return { a: 1 + att / 100, m: 1 + mid / 100, d: 1 + def / 100, b: [r(att), r(mid), r(def)] };
}
function shapeBar() {
  const L = M.L, el = $('#p2d'); if (!L || !el) return; let b = $('#shp');
  if (!b) { el.insertAdjacentHTML('afterend', '<div class="shp" id="shp"></div>'); b = $('#shp'); }
  const s = L.shp;
  b.innerHTML = s ? `<span>📍 Placement perso : attaque <b class="${s.b[0] >= 0 ? 'ok' : 'bad'}">${frPct(s.b[0])}</b> · milieu <b class="${s.b[1] >= 0 ? 'ok' : 'bad'}">${frPct(s.b[1])}</b> · défense <b class="${s.b[2] >= 0 ? 'ok' : 'bad'}">${frPct(s.b[2])}</b></span><button class="btn sm" data-a="cusReset">↺ Positions de la formation</button>`
    : (L.done ? '' : '<span class="mut">✋ Faites glisser vos joueurs sur le terrain pour changer leur placement, même en plein match.</span>');
}
function setPlace(i, px, py) {
  const L = live(); if (!L) return; const p = pById(S.xi[i]); if (!p) return;
  const off = (L.uoff && L.uoff[i]) || [0, 0], hx = clamp(px - off[0], 4, 74), hy = clamp(py - off[1], 4, 96);
  L.cus = L.cus || {}; L.cus[i] = [hx, hy]; L.shp = shapeOf(L);
  const dx = hx - defH(i), dy = hy - defV(i), d = [];
  if (dx > 3) d.push('plus haut'); else if (dx < -3) d.push('plus bas');
  if (dy < -4) d.push('décalé à gauche'); else if (dy > 4) d.push('décalé à droite');
  lev(L.min + .6, 'tac', 0, '📍', 'Repositionnement : ' + p.n + ' ' + (d.length ? d.join(' et ') : 'recentré sur son poste') + '.');
  liveFlush(false); liveHud(); shapeBar(); safe(() => pitchDraw([]));
}
A.cusReset = () => { const L = M.L; if (!L) return; L.cus = {}; L.shp = null; if (!L.done) { lev(L.min + .6, 'tac', 0, '📍', 'Retour aux positions de la formation.'); liveFlush(false); liveHud(); } shapeBar(); safe(() => pitchDraw([])); };
document.addEventListener('pointerdown', ev => {
  const t = ev.target.closest && ev.target.closest('#p2d i[data-u]'), L = live(); if (!t || !L || L.done) return;
  const i = +t.dataset.u; if (!i || !S.xi[i]) return;
  DR.d = { t, i, x0: ev.clientX, y0: ev.clientY, on: false, id: ev.pointerId };
});
document.addEventListener('pointermove', ev => {
  const d = DR.d; if (!d || ev.pointerId !== d.id) return; const el = $('#p2d'); if (!el) { DR.d = null; return; }
  if (!d.on) { if (Math.hypot(ev.clientX - d.x0, ev.clientY - d.y0) < 6) return; d.on = true; d.t.classList.add('drag'); el.classList.add('dragging'); }
  const r = el.getBoundingClientRect(); d.px = clamp((ev.clientX - r.left) / r.width * 100, 3, 97); d.py = clamp((ev.clientY - r.top) / r.height * 100, 4, 96);
  d.t.style.left = d.px + '%'; d.t.style.top = d.py + '%'; ev.preventDefault();
}, { passive: false });
const dragEndP = () => {
  const d = DR.d; DR.d = null; if (!d || !d.on) return; d.t.classList.remove('drag'); const el = $('#p2d'); if (el) el.classList.remove('dragging');
  try { DRAG_AT = Date.now(); } catch (e) { } setPlace(d.i, d.px, d.py);
};
document.addEventListener('pointerup', dragEndP); document.addEventListener('pointercancel', dragEndP);
wrapF('teamPower', o => function () {
  const r = o.apply(this, arguments), L = M.L;
  if (L && !L.done && L.shp && !mEl().hidden) { const s = L.shp; r.att *= s.a; r.mid *= s.m; r.def *= s.d; r.glob = (r.att + r.mid + r.def) / 3; r.bon = (r.bon || []).concat([{ n: '📍 Placement personnalisé', b: s.b }]); }
  return r;
});
wrapF('liveFormation', o => function () { const L = M.L; if (L) { L.cus = {}; L.shp = null; } const r = o.apply(this, arguments); safe(shapeBar); return r; });

/* ---------- 4. Vestiaire : ambiance, coach, joueurs et kiné ---------- */
const KINE = { sk: 1, hr: 0, hs: 1, bd: 0 };
const kineSVG = () => safe(() => `<svg viewBox="0 0 64 64" class="coachsvg" aria-hidden="true">${headSVG(KINE, '<path d="M6 64c0-13 11-19 26-19s26 6 26 19z" fill="#eef1f6"/><path d="M25 45l7 6 7-6" fill="none" stroke="#c9ced8" stroke-width="2"/><rect x="40" y="52" width="3.5" height="9" fill="#d61f2c"/><rect x="37.25" y="54.75" width="9" height="3.5" fill="#d61f2c"/>')}</svg>`, '🩺');
const half = L => L.atHT ? 'ht' : L.htAt && L.min > L.htAt ? 2 : 1;
function lkMood(L) {
  const d = L.a - L.b, t = L.talked ? L.talk : 1, reds = (L.reds || []).length;
  let k, txt;
  if (d >= 2) { k = 'joy'; txt = 'Ambiance euphorique : la musique est à fond et les joueurs se chambrent.'; }
  else if (d === 1) { k = 'conf'; txt = 'Ambiance concentrée et confiante : le groupe sent que le match est à sa portée.'; }
  else if (d === 0) { k = 'tens'; txt = 'Ambiance tendue : personne ne parle trop fort, tout se joue maintenant.'; }
  else if (d === -1) { k = 'low'; txt = 'Silence lourd. Les têtes sont basses, mais rien n\'est perdu.'; }
  else { k = 'down'; txt = 'Vestiaire abattu. Il va falloir trouver les mots justes.'; }
  if (reds) txt += ' Le carton rouge pèse sur les esprits.';
  if (L.oppRed) txt += ' Savoir l\'adversaire à dix redonne de l\'énergie.';
  if (L.talked) txt += t > 1.04 ? ' Votre discours a électrisé tout le monde.' : t > 1 ? ' Vos mots ont fait du bien.' : t < 1 ? ' Votre colère a jeté un froid.' : '';
  return { k, txt };
}
function coachLine(L, mode) {
  if (mode === 'ht' && L.talked) return L.talkMsg.split(' (')[0];
  const d = L.a - L.b, r = reg(L), reds = (L.reds || []).length;
  if (reds && d >= 0) return 'À dix, chacun fait un effort de plus. On reste groupés.';
  if (L.oppRed && d <= 0) return 'Ils sont à dix : on fait tourner le ballon, l\'espace va venir.';
  if (d >= 2) return 'C\'est bien, mais le match n\'est pas fini. On reste sérieux.';
  if (d === 1) return r >= 70 ? 'Dernier effort, on tient ce résultat ensemble.' : 'On continue comme ça, on cherche le deuxième.';
  if (d === 0) return 'Le prochain but fera la différence. On y va !';
  if (d === -1) return r >= 70 ? 'Il reste du temps. On pousse, on y croit !' : 'Un but, ce n\'est rien. On joue notre football.';
  return 'Relevez la tête. On se bat pour le maillot jusqu\'au bout.';
}
function lkPlayer(p, i, L) {
  const inj = L.inj.includes(p.id), rt = (L.rt || {})[p.id] || 0, en = Math.round(p.en);
  const em = inj ? '🤕' : L.yc && L.yc[p.id] ? '🟨' : rt >= .6 ? '😄' : rt <= -.6 ? '😞' : en < 50 ? '🥵' : en < 65 ? '😮‍💨' : '🙂';
  const col = en >= 75 ? 'var(--ok)' : en >= 55 ? '#ffc94d' : 'var(--bad)';
  return `<div class="lk-p${L.kineOn === p.id ? ' kn' : ''}" title="${esc(p.n)} · énergie ${en} %"><span class="lk-em" aria-hidden="true">${em}</span>${ava(p, 40)}<b>${esc(last(p.n))}</b><i class="lk-en" aria-hidden="true"><u style="width:${clamp(en, 4, 100)}%;background:${col}"></u></i><small>${en} %</small></div>`;
}
function lockerHTML(L, mode) {
  const md = lkMood(L), xi = S.xi.map((id, i) => [pById(id), i]).filter(x => x[0]), hurt = L.inj.map(pById).filter(Boolean);
  const tired = xi.filter(([p, i]) => i).sort((a, b) => a[0].en - b[0].en)[0], kh = half(L), done = L.kine && L.kine[kh];
  const kp = done ? null : tired && tired[0].en < 92 ? tired[0] : null; L.kineOn = kp ? kp.id : null;
  const kTxt = done ? esc(L.kine[kh]) : kp ? `Le kiné s'occupe de <b>${esc(kp.n)}</b> (énergie ${Math.round(kp.en)} %).` : 'Le kiné vérifie les chevilles et prépare les bandages.';
  const r = reg(L), st = L.st || { tirs: [0, 0] }, tip = safe(() => advice(L)[0], null);
  return `<section class="lkr lk-${md.k}" aria-label="Vestiaire">
<div class="lk-wall" aria-hidden="true"></div>
<div class="lk-top"><span class="lk-tag">${mode === 'ht' ? '🚪 Vestiaire · mi-temps' : '🚪 Vestiaire · pause'}</span><span class="lk-sc">${esc(liveClock(L.min))} · ${L.a} – ${L.b}</span></div>
<p class="lk-amb">🌡️ ${esc(md.txt)}</p>
<div class="lk-staff">
  <div class="lk-co"><div class="lk-fig">${safe(() => coachSVG(S.coach), '👔')}</div><div><b>${esc(coachN())}</b><em>« ${esc(coachLine(L, mode))} »</em></div></div>
  <div class="lk-bd"><b>${esc(S.formation)}</b><span>Possession ${Math.round(L.poss / Math.max(1, L.min))} %</span><span>Tirs ${st.tirs[0]} – ${st.tirs[1]}</span><span>Énergie ${energy()} %</span>${tip ? `<span class="lk-tip">🧠 ${esc(secCfg().n)} : ${esc(tip.short || tip.t)}</span>` : ''}</div>
  <div class="lk-ki"><div class="lk-fig">${kineSVG()}</div><div><b>Kiné</b><em>${kTxt}</em>${!done && kp ? `<button class="btn sm" data-a="lkKine">🩺 Soins (+${kineGain()} %)</button>` : ''}</div></div>
</div>
<div class="lk-bench">${xi.map(([p, i]) => lkPlayer(p, i, L)).join('')}${hurt.map(p => lkPlayer(p, -1, L)).join('')}</div>
${r < 3 ? '' : `<p class="lk-ft mut">Mentalité ${MEN[S.tac.men].n.toLowerCase()} · ligne ${LINE[S.tac.ln].n.toLowerCase()} · ${L.subs} / 5 changements</p>`}
</section>`;
}
const kineGain = () => Math.round(4 + (S.staff.med || 0) * 2);
A.lkKine = () => {
  const L = live(); if (!L) return; const kh = half(L); L.kine = L.kine || {}; if (L.kine[kh]) return;
  const g = kineGain(), ps = S.xi.map(pById).filter((p, i) => p && i && p.en < 92).sort((a, b) => a.en - b.en).slice(0, 2); if (!ps.length) return;
  ps.forEach(p => { p.en = Math.min(100, p.en + g); });
  L.kine[kh] = 'Soins terminés : ' + ps.map(p => p.n).join(' et ') + ' ont récupéré (+' + g + ' % d\'énergie).';
  lev(L.min + .6, 'tac', 0, '🩺', 'Le kiné soigne ' + ps.map(p => p.n).join(' et ') + '.'); liveFlush(false); liveHud();
  lkRefresh();
};
function lkRefresh() { const L = M.L; if (!L) return; if (!$('#modal').hidden && L.atHT) htModal(); else if ($('#lkr')) lkInline(); }
function lkInline() {
  const L = live(); if (!L) return; const old = $('#lkr'); if (old) old.remove();
  const at = $('#shp') || $('#p2d') || $('#mini'); if (!at) return;
  at.insertAdjacentHTML('afterend', `<div id="lkr">${lockerHTML(L, 'pause')}</div>`);
}
wrapF('htModal', o => function () {
  const r = o.apply(this, arguments), L = M.L;
  safe(() => { if (!L || !L.atHT) return; const h = $('#modal h2'); if (h) h.insertAdjacentHTML('afterend', lockerHTML(L, 'ht')); });
  return r;
});
wrapF('livePause', o => function (auto) { const r = o.apply(this, arguments); safe(() => { if (!auto) lkInline(); }); return r; });
wrapF('liveResume', o => function () { const old = $('#lkr'); if (old) old.remove(); return o.apply(this, arguments); });

/* ---------- 5. Une assistante qui comprend le match ---------- */
const TACK = { wd: ['etr', 'norm', 'lar'], ln: ['bas', 'med', 'haut'], tp: ['lent', 'norm', 'rap'] };
/** Cherche la combinaison largeur / ligne / tempo la plus efficace face à cet adversaire. */
function bestTac(o) {
  const cur = matchup(o), base = cur.xu / cur.xo; let best = null;
  TACK.wd.forEach(wd => TACK.ln.forEach(ln => TACK.tp.forEach(tp => {
    const T = Object.assign({}, S.tac, { wd, ln, tp }), m = matchup(o, T), v = m.xu / m.xo;
    if (!best || v > best.v + 1e-9) best = { wd, ln, tp, v, m };
  })));
  if (!best || best.v < base * 1.035) return null;
  const ch = []; if (best.wd !== S.tac.wd) ch.push('largeur ' + WID[best.wd].n.toLowerCase()); if (best.ln !== S.tac.ln) ch.push('ligne ' + LINE[best.ln].n.toLowerCase()); if (best.tp !== (S.tac.tp || 'norm')) ch.push('tempo ' + TEMPO[best.tp].n.toLowerCase());
  return ch.length ? Object.assign(best, { ch, gain: best.v / base }) : null;
}
const btn = (lab, a, d) => `<button class="btn sm" data-a="${a}"${Object.entries(d || {}).map(([k, v]) => ` data-${k}="${esc(v)}"`).join('')}>${lab}</button>`;
/** Conseils classés par importance, d'après l'état réel du match ou du club. */
function advice(Lx) {
  const L = Lx || live(), out = [], add = (pri, k, t, act, short) => out.push({ pri, k, t, act, short });
  if (L && !L.done) {
    const F = FORM[S.formation], d = L.a - L.b, r = reg(L), men = S.tac.men, st = L.st || { tirs: [0, 0] };
    if (L.subs < 5) {
      const tired = S.xi.map((id, i) => [pById(id), i]).filter(([p, i]) => p && i && p.en < 60).sort((a, b) => a[0].en - b[0].en);
      for (const [p, i] of tired) { const bi = bestBench(F[i][0], ovrAt(p, F[i][0]) * enF(p) * .95); if (bi >= 0) { const q = pById(S.bench[bi]); add(p.en < 48 ? 9 : 7, 'sub' + p.id, `${p.n} est à bout (${Math.round(p.en)} % d'énergie). ${q.n} est frais et peut le remplacer.`, btn('🔄 Faire entrer ' + esc(last(q.n)), 'secSub', { i, b: bi }), `${last(p.n)} est cuit, il faut le sortir.`); break; } }
    }
    if (L.oppRed && d <= 0 && men !== 'o' && men !== 'uo') add(8, 'red+', 'Ils jouent à dix : c\'est le moment d\'attaquer, avec du monde devant.', btn('Mentalité offensive', 'secTac', { men: 'o' }), 'Ils sont à dix, on attaque !');
    if ((L.reds || []).length && d >= 0 && men !== 'd' && men !== 'ud') add(8, 'red-', 'À dix contre onze, mieux vaut resserrer le bloc et protéger le résultat.', btn('Mentalité défensive', 'secTac', { men: 'd', ln: 'bas' }), 'À dix, on reste compact.');
    if (r >= 60 && d < 0 && men !== 'uo' && (r >= 80 || d <= -2 ? true : men !== 'o')) { const v = r >= 80 || d <= -2 ? 'uo' : 'o'; add(r >= 80 ? 9 : 7, 'chase' + v, `Mené ${L.a} – ${L.b} à la ${r}e : il faut prendre des risques.`, btn(MEN[v].n, 'secTac', { men: v }), 'Il faut prendre des risques maintenant.'); }
    if (r >= 76 && d === 1 && (men === 'o' || men === 'uo' || men === 'e')) add(7, 'hold', `Un but d'avance à la ${r}e : on peut fermer le jeu pour tenir le score.`, btn('Mentalité défensive', 'secTac', { men: 'd' }), 'On ferme la boutique.');
    if (r >= 25 && st.tirs[1] >= st.tirs[0] * 2 + 3) add(5, 'dom', `Ils dominent (tirs ${st.tirs[0]} – ${st.tirs[1]}). Il faut couper leurs circuits.`, null, 'On subit, il faut réagir.');
    const bt = bestTac(L.o); if (bt) add(6, 'tac' + bt.wd + bt.ln + bt.tp, `Face à leur jeu (${STYLES[L.o.sty].n.toLowerCase()}), passez en ${bt.ch.join(', ')} : ${pct(bt.m.xu)} d'occasions créées, ${pct(bt.m.xo)} concédées.`, btn('Appliquer', 'secTac', { wd: bt.wd, ln: bt.ln, tp: bt.tp }), 'Changeons de réglages : ' + bt.ch.join(', ') + '.');
  } else if (S && !S.ended) {
    const o = safe(() => getOpp(), null), tp = teamPower();
    if (o) {
      const ln = [['leur attaque', o.a, 'notre défense', tp.def], ['leur milieu', o.m, 'notre milieu', tp.mid], ['leur défense', o.d, 'notre attaque', tp.att]].sort((a, b) => (a[1] - a[3]) - (b[1] - b[3]));
      add(5, 'weak', `Point faible de ${o.name} : ${ln[0][0]} (${Math.round(ln[0][1])} contre ${Math.round(ln[0][3])} pour ${ln[0][2]}).`, null, 'Visons ' + ln[0][0] + '.');
      const bt = safe(() => bestTac(o), null); if (bt) add(6, 'pre', `Contre ${o.name} (${STYLES[o.sty].n.toLowerCase()}), le meilleur plan : ${bt.ch.join(', ')} (${pct(bt.m.xu)} créées, ${pct(bt.m.xo)} concédées).`, btn('Appliquer', 'secTac', { wd: bt.wd, ln: bt.ln, tp: bt.tp }), 'J\'ai un plan : ' + bt.ch.join(', ') + '.');
    }
    const xi = S.xi.map(pById); const bad = xi.find(p => p && (p.inj || p.sus)); if (bad) add(9, 'bad', `${bad.n} est ${bad.inj ? 'blessé' : 'suspendu'} mais figure dans le onze.`, btn('Meilleur onze', 'auto'));
    const tir = xi.filter(p => p && p.en < 65).sort((a, b) => a.en - b.en); if (tir.length) add(6, 'rot', `${tir.length > 1 ? tir.length + ' titulaires sont fatigués' : tir[0].n + ' est fatigué'} (${tir.map(p => last(p.n) + ' ' + Math.round(p.en) + ' %').slice(0, 3).join(', ')}). Pensez à faire tourner.`, null);
    if (S.coach.pref && S.coach.pref !== S.formation) add(3, 'pref', `Votre coach préfère le ${S.coach.pref} (bonus de cohésion), vous jouez en ${S.formation}.`, null);
  }
  return out.sort((a, b) => b.pri - a.pri);
}
A.secSub = d => { const L = live(); if (!L) return; if (liveSub(+d.i, +d.b)) { liveFlush(false); liveHud(); safe(() => pitchDraw([])); ASST.say('Changement effectué. 👍', 'wave', 2, 2200); lkRefresh(); } };
A.secTac = d => {
  const L = live(), ch = [];
  if (d.men) { S.tac.men = d.men; ch.push('mentalité ' + MEN[d.men].n.toLowerCase()); }
  if (d.wd) { S.tac.wd = d.wd; ch.push('largeur ' + WID[d.wd].n.toLowerCase()); }
  if (d.ln) { S.tac.ln = d.ln; ch.push('ligne ' + LINE[d.ln].n.toLowerCase()); }
  if (d.tp) { S.tac.tp = d.tp; ch.push('tempo ' + TEMPO[d.tp].n.toLowerCase()); }
  if (L) { lev(L.min + .6, 'tac', 0, '📋', 'Consigne : ' + ch.join(', ') + '.'); liveFlush(false); liveHud(); lkRefresh(); } else { save(); safe(() => render()); }
  ASST.say('C\'est noté : ' + esc(ch.join(', ')) + '.', 'point', 2, 2600);
};
/* Conseils spontanés pendant le match : au bon moment, sans en abuser. */
wrapF('liveStep', o => function () {
  const r = o.apply(this, arguments);
  safe(() => {
    const L = live(); if (!L || L.paused || M.skip || !secCfg().on) return;
    L.tipK = L.tipK || {}; if (L.min - (L.tipAt || -99) < 8 || Object.keys(L.tipK).length >= 6) return;
    const t = advice(L).find(x => x.pri >= 6 && !L.tipK[x.k]); if (!t) return;
    L.tipK[t.k] = 1; L.tipAt = L.min; ASST.say(esc(t.t) + (t.act ? `<div class="sec-acts">${t.act}</div>` : ''), 'point', 2, 9000);
  });
  return r;
});
/* Questions sur le club et le match, en français courant. */
function secAsk(txt) {
  const t = String(txt || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim(), has = r => r.test(t), L = live();
  if (!t) return null;
  const list = a => a.map(x => `<div class="bl"><span>💡</span><span>${esc(x.t)}</span>${x.act || ''}</div>`).join('');
  if (has(/conseil|que (dois|faut|faire)|quoi faire|on fait quoi|comment (gagner|battre|jouer|faire)|\btactique|strateg|analyse|aide.?moi|des idees|ton avis/)) {
    const a = advice().slice(0, 3); return [a.length ? (L ? 'Mon analyse du match :' : 'Pour le prochain match :') + list(a) : 'Tout est en ordre, coach. Rien à signaler.', 'point'];
  }
  if (has(/fatigu|energie|crame|epuise|souffle|\bcuit/)) {
    const ps = S.xi.map(pById).filter(Boolean).sort((a, b) => a.en - b.en).slice(0, 4);
    if (ps.length && ps[0].en >= 85) return ['Tout le monde est frais : énergie moyenne ' + energy() + ' %. Le moins en jambes : ' + esc(ps[0].n) + ' (' + Math.round(ps[0].en) + ' %).', 'cheer'];
    return ['Les plus fatigués : ' + ps.map(p => `<b>${esc(p.n)}</b> ${Math.round(p.en)} %`).join(', ') + '. Énergie moyenne : ' + energy() + ' %.', ps[0] && ps[0].en < 60 ? 'sad' : 'point'];
  }
  if (has(/bless|infirmerie|\bkine|suspendu|indisponible/)) {
    const inj = S.players.filter(p => p.inj > 0), sus = S.players.filter(p => p.sus > 0);
    return [inj.length || sus.length ? (inj.length ? '🚑 Blessés : ' + inj.map(p => `${esc(p.n)} (${p.inj} match${p.inj > 1 ? 's' : ''})`).join(', ') + '. ' : '') + (sus.length ? '🟥 Suspendus : ' + sus.map(p => esc(p.n)).join(', ') + '.' : '') : 'Infirmerie vide : tout le monde est apte !', inj.length ? 'sad' : 'cheer'];
  }
  if (has(/buteur|qui (a )?marque|meilleur attaquant/)) {
    if (L && L.scorers && Object.keys(L.scorers).length) { const s = Object.entries(L.scorers).map(([id, n]) => { const p = pById(+id) || pById(id); return p ? esc(p.n) + (n > 1 ? ' ×' + n : '') : null; }).filter(Boolean); if (s.length) return ['Nos buteurs ce soir : ' + s.join(', ') + '.', 'cheer']; }
    const ps = S.players.filter(p => p.sg).sort((a, b) => b.sg - a.sg).slice(0, 3);
    return [ps.length ? 'Meilleurs buteurs de la saison : ' + ps.map(p => `<b>${esc(p.n)}</b> (${p.sg})`).join(', ') + '.' : 'Personne n\'a encore marqué cette saison.', 'point'];
  }
  if (has(/meilleur joueur|qui est (le|notre) meilleur|\bstar\b|plus fort|homme du match/)) {
    if (L) { const b = S.xi.map(pById).filter(Boolean).sort((a, b2) => ((L.rt || {})[b2.id] || 0) - ((L.rt || {})[a.id] || 0))[0]; if (b) return ['Pour l\'instant, le meilleur sur le terrain : <b>' + esc(b.n) + '</b>.', 'cheer']; }
    const b = S.players.slice().sort((a, b2) => seen(b2).ov - seen(a).ov)[0]; return [b ? 'Notre joueur le plus fort : <b>' + esc(b.n) + '</b> (' + POS[b.pos].n.toLowerCase() + ', note ' + seen(b).ov + ').' : 'Je cherche…', 'point'];
  }
  if (has(/\bscore\b|on en est|ou en est|resultat|qui gagne|on mene|on perd/)) {
    if (L) return [`${esc(liveClock(L.min))} : ${esc(S.club.name)} ${L.a} – ${L.b} ${esc(L.o.name)}. Tirs ${L.st.tirs[0]} – ${L.st.tirs[1]}, possession ${Math.round(L.poss / Math.max(1, L.min))} %.`, L.a >= L.b ? 'point' : 'sad'];
    return ['Pas de match en cours. Bilan de la saison : ' + S.rec.w + ' victoires, ' + S.rec.d + ' nuls, ' + S.rec.l + ' défaites.', 'point'];
  }
  if (has(/adversaire|prochain match|contre qui|on joue qui|on affronte/)) {
    const o = L ? L.o : safe(() => getOpp(), null); if (!o) return ['Pas de match prévu pour l\'instant.', ''];
    const a = advice(L).find(x => x.k === 'weak' || x.k === 'pre' || x.k.startsWith('tac'));
    return [`${esc(o.name)} : style ${STYLES[o.sty].n.toLowerCase()}, ligne ${LINE[o.ln].n.toLowerCase()}, attaque ${Math.round(o.a)} · milieu ${Math.round(o.m)} · défense ${Math.round(o.d)}.` + (a ? list([a]) : ''), 'point'];
  }
  if (has(/classement|\brang\b|quelle place|notre place|on est combien|on est ou/)) { const tb = table(), me = tb.find(x => x.id === 0); return [`Nous sommes ${ord(myPos())} sur ${tb.length}` + (me ? ` avec ${me.pts} points (${me.GF} buts marqués, ${me.GA} encaissés).` : '.'), myPos() <= 3 ? 'cheer' : 'point']; }
  if (has(/budget|argent|financ|tresor|caisse|combien.*(euro|sous)/)) return ['Budget du club : <b>' + eur(S.budget) + '</b>.' + (S.budget < 0 ? ' Attention, nous sommes à découvert.' : ''), S.budget < 0 ? 'sad' : 'point'];
  if (has(/\bmoral\b|\bforme\b|confiance/)) { const m = moral(), f = forme(); return [`Moral ${m} / 100, forme ${f} / 100. ` + (m >= 70 ? 'Le groupe est en confiance.' : m >= 50 ? 'Ça va, sans plus.' : 'Le groupe doute, une victoire ferait du bien.'), m >= 60 ? 'cheer' : 'sad']; }
  if (has(/remplac|changement|qui (sortir|faire entrer)/)) {
    if (!L) return ['Les changements se font pendant le match, coach.', ''];
    const a = advice(L).find(x => x.k.startsWith('sub')); return [a ? esc(a.t) + `<div class="sec-acts">${a.act}</div>` : 'Personne n\'a besoin de sortir pour l\'instant.', 'point'];
  }
  return null;
}
wrapF('secOrder', o => function (txt) { const r = safe(() => secAsk(txt), null); return r || o.apply(this, arguments); });
wrapF('secBrief', o => function () {
  let h = o.apply(this, arguments);

});

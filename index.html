<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>League Master — Football Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== LEAGUE MASTER — styles ===== */
:root{
  --bg:#04060c;--navy:#08101f;--panel:#0d172b;--panel2:#132140;--line:#22325a;
  --gold:#e9bb4d;--gold2:#f8e19a;--text:#ecf1ff;--mut:#8d9cc3;
  --ok:#36d283;--bad:#ff5b6c;--warn:#ffb648;--blue:#4a86ff;
  --disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow','Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--disp);margin:0;letter-spacing:.01em;line-height:1.05}
h2{font-size:30px;font-weight:800;font-style:italic;text-transform:uppercase}
h3{font-size:20px;font-weight:700;text-transform:uppercase}
p{margin:0 0 8px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mut{color:var(--mut)}.gold{color:var(--gold)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.num{font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- Structure ---------- */
#app{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"nav top" "nav main";height:100%}
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:10px 18px;background:linear-gradient(180deg,#0b1428,#070d1a);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.tclub{display:flex;align-items:center;gap:10px;margin-right:auto;flex:none}
.tclub b{font-family:var(--disp);font-size:22px;font-style:italic;font-weight:800;text-transform:uppercase;white-space:nowrap}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#0f1b35;border:1px solid var(--line);font-family:var(--disp);font-size:17px;font-weight:600;white-space:nowrap}
.chip small{font-family:var(--body);font-size:11px;color:var(--mut);font-weight:500}
.chip.bell{cursor:pointer;position:relative}
.chip.bell i{position:absolute;top:-5px;right:-4px;background:var(--bad);color:#fff;font-style:normal;font-size:11px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;font-family:var(--body);font-weight:700}
#nav{grid-area:nav;background:linear-gradient(180deg,#0a1224,#050910);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.brand{font-family:var(--disp);font-weight:800;font-style:italic;font-size:25px;text-transform:uppercase;padding:4px 10px 14px;line-height:.9;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#a9791f);-webkit-background-clip:text;background-clip:text;color:transparent}
.nb{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--mut);font-weight:600;text-align:left;transition:background .15s,color .15s}
.nb span{font-size:18px;width:22px;text-align:center}
.nb:hover{background:#101c38;color:var(--text)}
.nb.nd{padding:8px 12px}.nb.ngm,.subnav{display:none}
.ngl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#5d6d98;padding:12px 12px 3px}
.nb.on{background:linear-gradient(90deg,rgba(233,187,77,.2),rgba(233,187,77,.03));color:var(--gold2);box-shadow:inset 3px 0 0 var(--gold)}
#main{grid-area:main;overflow-y:auto;padding:22px 22px 40px;background:radial-gradient(1100px 500px at 85% -10%,rgba(40,80,190,.2),transparent 60%),var(--bg)}
.page{max-width:1240px;margin:0 auto;animation:pgin .28s ease both}
@keyframes pgin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-team{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.panel{background:linear-gradient(180deg,var(--panel),#0a1222);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel>h3{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel>h3 small{font-family:var(--body);font-size:12px;color:var(--mut);text-transform:none;font-weight:500}

/* ---------- Boutons & champs ---------- */
.btn{border:1px solid var(--line);background:#12203f;padding:9px 16px;border-radius:10px;font-weight:600;transition:transform .12s,filter .15s,background .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.2)}.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#b98a27);border-color:#f6dc8e;color:#1a1204;font-weight:700;box-shadow:0 6px 22px rgba(233,187,77,.25)}
.btn.big{font-family:var(--disp);font-size:22px;font-style:italic;text-transform:uppercase;padding:12px 28px;font-weight:800}
.btn.red{background:#3a1220;border-color:#7a2436;color:#ffc2ca}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
.fld input,.fld select,.inp{background:#0a1326;border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--text);font-size:15px;min-width:0}
.fld input[type=color]{padding:2px;height:40px;width:56px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:#0c1630;color:var(--mut);padding:7px 14px;border-radius:999px;font-weight:600}
.tab.on{background:var(--gold);border-color:var(--gold);color:#1a1204}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 2px #000 inset}
.opt{border:1px solid var(--line);background:#0c1630;border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt.on{border-color:var(--gold);background:rgba(233,187,77,.12)}
.opt b{font-family:var(--disp);font-size:18px}.opt small{color:var(--mut)}

/* ---------- Barres ---------- */
.bar{height:8px;border-radius:6px;background:#0a1326;overflow:hidden;border:1px solid #182646}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#2f6bff,#6fd0ff);width:0;animation:grow .7s ease forwards}
.bar.gd i{background:linear-gradient(90deg,#b98a27,var(--gold2))}.bar.gr i{background:linear-gradient(90deg,#1c9b5c,#5df0a5)}.bar.rd i{background:linear-gradient(90deg,#b0283b,#ff7b89)}
@keyframes grow{from{width:0}to{width:var(--w)}}
.stat{display:grid;grid-template-columns:92px 1fr 40px;gap:10px;align-items:center;margin:7px 0;font-size:13px;color:var(--mut);font-weight:600}
.stat b{color:var(--text);text-align:right;font-family:var(--disp);font-size:18px}
.gauge{--v:50;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--v)*1%),#132140 0);display:grid;place-items:center;flex:none}
.gauge div{width:104px;height:104px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;font-family:var(--disp)}
.gauge b{font-size:38px;line-height:.9;display:block}.gauge small{font-size:12px;color:var(--mut);font-family:var(--body)}

/* ---------- Accueil ---------- */
.hero{position:relative;border-radius:20px;padding:24px;border:1px solid #2b3d6e;background:linear-gradient(115deg,#0b1a3e 0%,#0a1226 55%,#15100a 100%);overflow:hidden;margin-bottom:16px}
.hero::after{content:"";position:absolute;right:-90px;top:-130px;width:420px;height:420px;border:60px solid rgba(233,187,77,.07);border-radius:50%;pointer-events:none}
.hero .hi{font-family:var(--disp);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(34px,6vw,62px);line-height:.92}
.hero .hi em{font-style:italic;display:block;font-size:.42em;color:var(--gold);letter-spacing:.06em}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px;position:relative;z-index:1}
.tile{background:rgba(4,8,18,.55);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile span{font-size:12px;color:var(--mut);font-weight:600}
.tile b{display:block;font-family:var(--disp);font-size:26px;font-weight:700}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.vs .tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--disp);font-size:20px;font-weight:700;text-transform:uppercase;line-height:1}
.vs .mid{font-family:var(--disp);font-style:italic;font-weight:800;font-size:30px;color:var(--gold)}
.cd{font-family:var(--disp);font-size:30px;font-weight:700;letter-spacing:.04em}
.pill{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font-weight:800;font-family:var(--disp);font-size:16px}
.pill.V{background:#12492f;color:#7dffb9}.pill.N{background:#3c3a1d;color:#ffe48a}.pill.D{background:#4b1623;color:#ff9aa6}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #15223f;font-size:14px}
.li:last-child{border:0}.li.tl>span:nth-child(2){flex:1 1 0;min-width:0}.li.tl{flex-wrap:nowrap}.li .sp{margin-left:auto;text-align:right}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{font-size:11px;color:var(--mut);font-weight:600;text-align:center;padding:6px 4px}
.tb td{padding:7px 4px;text-align:center;border-top:1px solid #15223f;font-variant-numeric:tabular-nums}
.tb td:nth-child(2),.tb th:nth-child(2){text-align:left}
.tb tr.me td{background:rgba(233,187,77,.12);color:var(--gold2);font-weight:700}
.tb tr.cl td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.scroll-x{overflow-x:auto}

/* ---------- Cartes joueurs ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:14px}
.pc{--c1:#3a2416;--c2:#8d5b32;--ink:#ffe6cf;--gl:rgba(200,130,70,.35);position:relative;border-radius:16px;padding:10px 10px 9px;color:var(--ink);background:linear-gradient(155deg,var(--c2),var(--c1) 62%);border:1px solid rgba(255,255,255,.22);box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.4) inset;overflow:hidden;transition:transform .16s,box-shadow .16s;text-align:left;isolation:isolate}
.pc[data-a]{cursor:pointer}
.pc[data-a]:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.55),0 0 22px var(--gl)}
.pc::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.16) 48%,transparent 60%);z-index:-1}
.pc.r1{--c1:#262c35;--c2:#8e9aab;--ink:#f1f5fb;--gl:rgba(180,200,230,.35)}
.pc.r2{--c1:#3d2b05;--c2:#d6a638;--ink:#fff3cf;--gl:rgba(233,187,77,.5)}
.pc.r3{--c1:#071c45;--c2:#2f7bff;--ink:#e6efff;--gl:rgba(70,130,255,.6)}
.pc.r4{--c1:#22083f;--c2:#a04dff;--ink:#f3e6ff;--gl:rgba(170,90,255,.65)}
.pc.r5{--c1:#0c0903;--c2:#2a1f08;--ink:#ffe9a8;--gl:rgba(255,215,110,.8);border-color:var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 18px rgba(233,187,77,.35)}
.pc.r3::before,.pc.r4::before,.pc.r5::before{background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 48%,transparent 62%);background-size:250% 100%;animation:shine 3.6s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;height:84px}
.pc-id{display:flex;flex-direction:column;align-items:center;line-height:1;font-family:var(--disp)}
.pc-id b{font-size:40px;font-weight:800}.pc-id span{font-size:16px;font-weight:700}.pc-id i{font-style:normal;font-size:16px;margin-top:3px;font-family:var(--body)}
.face{width:84px;height:84px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.pc-rar{position:absolute;right:0;top:0;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.45)}
.pc h4{font-size:19px;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid rgba(255,255,255,.25);border-bottom:1px solid rgba(255,255,255,.25);padding:4px 0;margin:2px 0 6px;text-align:center}
.pc-st{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 2px;font-size:10px;font-weight:600;text-align:center;opacity:.95}
.pc-st b{display:block;font-family:var(--disp);font-size:18px;line-height:1}
.pc-ft,.pc-ft2{display:flex;justify-content:space-between;font-size:11px;margin-top:6px;font-weight:600}
.pc-ft2{font-family:var(--disp);font-size:15px;background:rgba(0,0,0,.35);margin:6px -10px -9px;padding:5px 10px}
.pc .inj{position:absolute;left:8px;bottom:34px;font-style:normal;font-size:11px;background:#7a1626;color:#fff;border-radius:6px;padding:1px 6px}
.pc-foot{margin:9px -10px -9px;padding:8px 10px;background:rgba(0,0,0,.55);display:flex;flex-direction:column;gap:6px;font-size:13px}
.pc-foot .btn{width:100%}
.pc-foot s{opacity:.6;font-size:12px}
.pc.has-foot .pc-ft2{margin-bottom:0}

/* ---------- Terrain ---------- */
.pitch{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:68/88;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:repeating-linear-gradient(180deg,#14713e 0 11.11%,#0f6235 11.11% 22.22%);overflow:hidden}
.pitch::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.35)}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:2px solid rgba(255,255,255,.35);border-radius:50%;transform:translate(-50%,-50%)}
.box{position:absolute;left:22%;right:22%;height:15%;border:2px solid rgba(255,255,255,.35)}
.box.t{top:-2px}.box.b{bottom:-2px}
.slot{position:absolute;transform:translate(-50%,-50%);width:66px;padding:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;color:#fff;z-index:1}
.slot .so{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:21px;font-weight:800;background:linear-gradient(160deg,var(--c2,#8d5b32),var(--c1,#3a2416));border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.5);position:relative;transition:transform .15s}
.slot:hover .so{transform:scale(1.1)}
.slot.off .so{border-color:var(--warn)}.slot.empty .so{background:#0006;border-style:dashed}
.slot .sn{font-size:11px;font-weight:700;background:rgba(0,0,0,.65);padding:1px 5px;border-radius:5px;max-width:74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sp{font-size:10px;font-weight:700;color:var(--gold2)}
.slot .cap{position:absolute;right:-6px;top:-6px;width:17px;height:17px;border-radius:50%;background:var(--gold);color:#1a1204;font-size:11px;display:grid;place-items:center;font-family:var(--body);font-weight:800}
.slot .en{position:absolute;left:4px;right:4px;bottom:-5px;height:3px;border-radius:2px;background:#0008}
.slot .en i{display:block;height:100%;border-radius:2px;background:var(--ok)}
.slot.r1{--c1:#262c35;--c2:#8e9aab}.slot.r2{--c1:#3d2b05;--c2:#d6a638}.slot.r3{--c1:#071c45;--c2:#2f7bff}.slot.r4{--c1:#22083f;--c2:#a04dff}.slot.r5{--c1:#0c0903;--c2:#caa13c}
.bench{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.bench .slot{position:static;transform:none;width:auto}
.pk{display:grid;grid-template-columns:46px 1fr auto auto;gap:10px;align-items:center;width:100%;padding:8px 10px;border:1px solid var(--line);background:#0c1630;border-radius:10px;text-align:left;margin-bottom:6px}
.pk:hover{border-color:var(--gold)}
.pk .po{font-family:var(--disp);font-size:22px;font-weight:800;text-align:center}
.pk small{color:var(--mut);display:block}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:#1a2a52;color:#b9c9f5;font-weight:600;white-space:nowrap}
.tag.g{background:rgba(233,187,77,.18);color:var(--gold2)}.tag.r{background:#4b1623;color:#ff9aa6}.tag.v{background:#12492f;color:#7dffb9}

/* ---------- Modale ---------- */
#modal{position:fixed;inset:0;z-index:60;background:rgba(2,4,10,.78);backdrop-filter:blur(5px);display:grid;place-items:center;padding:14px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbox{position:relative;width:min(560px,100%);max-height:92%;overflow-y:auto;background:linear-gradient(180deg,#101c38,#0a1224);border:1px solid #2b3d6e;border-radius:18px;padding:20px;animation:pop .25s cubic-bezier(.2,1.3,.4,1)}
.mbox.wide{width:min(860px,100%)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.mx{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#0a1326;font-size:16px;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.pm{display:grid;grid-template-columns:200px 1fr;gap:18px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13px}
.kv span{color:var(--mut)}.kv b{text-align:right}
.offer{text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:#0a1326;margin:10px 0}
.offer b{display:block;font-family:var(--disp);font-size:34px}
.reveal{display:grid;place-items:center;gap:16px;text-align:center}
.reveal .pc{width:210px;animation:flip 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes flip{0%{transform:perspective(900px) rotateY(180deg) scale(.5);filter:brightness(4)}60%{filter:brightness(1.8)}100%{transform:perspective(900px) rotateY(0) scale(1);filter:none}}

/* ---------- Toasts ---------- */
#toasts{position:fixed;right:14px;top:calc(64px + env(safe-area-inset-top,0px));z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(340px,calc(100% - 28px))}
.toast{pointer-events:auto;cursor:pointer;background:#101d3b;border:1px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .3s ease both,tout .4s ease 3.2s forwards}
@keyframes tin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateX(40px);opacity:0}}

/* ---------- Match ---------- */
#match{position:fixed;inset:0;z-index:50;background:radial-gradient(900px 500px at 50% 0,#12285c,#04060c 70%);overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px))}
.mw{max-width:760px;margin:0 auto;animation:pgin .3s both}
.mcomp{text-align:center;color:var(--gold2);font-family:var(--disp);font-size:20px;font-weight:700;text-transform:uppercase;margin-bottom:12px}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:rgba(4,8,18,.7);border:1px solid #2b3d6e;border-radius:18px;padding:16px}
.sb .tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--disp);font-size:20px;font-weight:700;text-transform:uppercase;text-align:center;line-height:1}
.score{font-family:var(--disp);font-size:66px;font-weight:800;line-height:.9;letter-spacing:.02em;text-align:center}
.clock{display:block;font-size:18px;color:var(--gold);font-weight:700;text-align:center;margin-top:4px}
.tline{height:5px;border-radius:3px;background:#0a1326;margin:12px 0;overflow:hidden}.tline i{display:block;height:100%;width:0;background:var(--gold)}
.feed{display:flex;flex-direction:column-reverse;gap:6px;min-height:240px}
.ev{display:grid;grid-template-columns:30px 40px 1fr;gap:6px;align-items:center;padding:9px 12px;border-radius:10px;background:#0c1630;border:1px solid #182646;font-size:14px;animation:evin .3s ease both}
.ev b{font-family:var(--disp);font-size:18px;color:var(--mut)}
.ev.goal{background:linear-gradient(90deg,rgba(233,187,77,.28),rgba(233,187,77,.05));border-color:var(--gold);font-weight:700}
.ev.goal.o{background:linear-gradient(90deg,rgba(255,91,108,.22),rgba(255,91,108,.03));border-color:#7a2436}
@keyframes evin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.cmp{display:grid;grid-template-columns:54px 1fr 110px 1fr 54px;gap:8px;align-items:center;margin:9px 0;font-size:12px;color:var(--mut);text-align:center;font-weight:700}
.cmp b{font-family:var(--disp);font-size:22px;color:var(--text)}
.cmp .bar.l{transform:scaleX(-1)}
.res-t{font-family:var(--disp);font-weight:800;font-style:italic;font-size:clamp(46px,11vw,84px);text-transform:uppercase;text-align:center;line-height:.95;margin:6px 0 14px}
.res-t.V{background:linear-gradient(180deg,#fff6d0,var(--gold) 55%,#a9791f);-webkit-background-clip:text;background-clip:text;color:transparent;animation:win .7s cubic-bezier(.2,1.5,.4,1) both}
.res-t.D{color:#7c89ab;animation:lose .7s ease both}.res-t.N{color:#ffe48a;animation:win .5s both}
@keyframes win{from{transform:scale(.3) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes lose{0%{transform:translateY(-30px);opacity:0}60%{transform:translateY(6px)}100%{transform:none;opacity:1}}
.rw{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.rw div{background:#0c1630;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.rw b{display:block;font-family:var(--disp);font-size:30px;color:var(--gold2)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.goalfx{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle,rgba(233,187,77,.35),transparent 60%);animation:gfx 1s ease both}
.goalfx b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:clamp(80px,24vw,220px);color:#fff;text-shadow:0 0 40px var(--gold),0 8px 0 #a9791f}
.goalfx.o{background:radial-gradient(circle,rgba(255,91,108,.25),transparent 60%)}.goalfx.o b{text-shadow:0 0 40px var(--bad),0 8px 0 #7a1626;font-size:clamp(50px,14vw,120px)}
@keyframes gfx{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.08)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}
.conf{position:absolute;top:-20px;width:9px;height:16px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- Divers ---------- */
.stad svg{width:100%;height:auto;display:block}
.lad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.lad div{padding:9px 4px;border-radius:10px;background:#0c1630;border:1px solid var(--line);text-align:center;font-weight:700;font-size:13px;color:var(--mut)}
.lad div.on{background:rgba(233,187,77,.16);border-color:var(--gold);color:var(--gold2)}
.bcard{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0c1630}
.bcard .ic{font-size:30px;width:50px;height:50px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,#1c2f63,#0a1326);flex:none}
.bcard>div:nth-child(2){flex:1;min-width:0}
.pack{border-radius:16px;padding:18px;text-align:center;border:1px solid var(--line);background:linear-gradient(160deg,#1a2648,#0a1224);display:flex;flex-direction:column;gap:8px;align-items:center}
.pack .pi{width:86px;height:118px;border-radius:12px;display:grid;place-items:center;font-size:40px;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.troph{display:flex;flex-wrap:wrap;gap:10px}
.troph div{padding:10px 14px;border-radius:12px;background:linear-gradient(160deg,rgba(233,187,77,.22),rgba(233,187,77,.04));border:1px solid var(--gold);font-weight:700}
.bye{text-align:center}.bye .bye-av{width:96px;height:96px;margin:0 auto 8px;display:block;box-shadow:0 0 0 3px var(--gold),0 10px 30px rgba(233,187,77,.25)}
.bye-k{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
.bye-st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.bye-st div{padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:#0c1630}
.bye-st b{display:block;font-size:34px;line-height:1;color:var(--gold2)}.bye-st small{color:var(--mut);font-size:12px}
.bye-ch{display:grid;gap:8px;margin-top:12px}.bye-ch .btn{white-space:normal;text-align:left;padding:10px 14px}
.bye-ch .btn small{display:block;font-weight:500;font-size:12px;opacity:.8;margin-top:2px}
.draw{text-align:center}
.dr-l{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0;text-align:left}.dr-l.one{grid-template-columns:minmax(0,1fr);max-width:380px;margin:14px auto}
.dr-t{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:#0c1630;min-height:42px}
.dr-l.one .dr-t{grid-template-columns:86px minmax(0,1fr)}
.dr-t i{font-style:normal;color:var(--mut)}.dr-t .dr-b:last-child{text-align:right}.dr-l.one .dr-b:last-child{text-align:left}
.dr-t.me{border-color:var(--gold);background:rgba(233,187,77,.1)}
.dr-b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;animation:drin .4s cubic-bezier(.2,1.5,.4,1) both}
.dr-e{animation:drin .4s ease both}.dr-s{margin-top:10px;animation:drout .01s linear both}
@keyframes drin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes drout{from{visibility:visible}to{visibility:hidden}}
.draw.now .dr-b,.draw.now .dr-e{animation:none}.draw.now .dr-s{display:none}
@media (prefers-reduced-motion:reduce){.dr-b,.dr-e,.dr-s{animation-delay:0s!important}}
@media (max-width:560px){.dr-l{grid-template-columns:minmax(0,1fr)}}
.brk{display:flex;gap:12px;align-items:stretch}
.brc{flex:1 1 0;min-width:160px;display:flex;flex-direction:column}
.brc h4{font-size:13px;font-weight:700;text-transform:uppercase;color:var(--mut);margin-bottom:8px;letter-spacing:.04em}
.brl{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.brm{border:1px solid var(--line);border-radius:10px;background:#0c1630;overflow:hidden}
.brm>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 9px;font-size:13px;min-height:29px}
.brm>div+div{border-top:1px solid #15223f}.brm>div>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brm .w{font-weight:700}.brm .l{color:var(--mut)}.brm .u{background:rgba(233,187,77,.12);color:var(--gold2)}.brm small{font-weight:500;opacity:.75}
.motm{display:flex;align-items:center;gap:14px}.motm>div{flex:1;min-width:0;display:flex;flex-direction:column}
.motm>div b{font-family:var(--disp);font-size:24px;font-style:italic;text-transform:uppercase;line-height:1.1}.motm>b{font-size:40px;line-height:1}
.hl-cap{display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#0c1630;font-size:15px}
.hl-cap b{font-size:22px;flex:none}.hl-ch{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.hl-ch .tab{flex:none}
.empty{padding:22px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:12px}

/* ---------- Mode daltonien : bleu / orange à la place de vert / rouge, et symboles ---------- */
body.cb{--ok:#4aa3ff;--bad:#ff9d2e}
body.cb .pill.V{background:#0f3d66;color:#a9d6ff}body.cb .pill.D{background:#5a3305;color:#ffc98a}body.cb .pill.N{background:#3a3a44;color:#e6e6ee}
body.cb .pill.V::after{content:"▲";font-size:8px;margin-left:1px}body.cb .pill.D::after{content:"▼";font-size:8px;margin-left:1px}body.cb .pill{width:34px;display:inline-flex;align-items:center;justify-content:center}
body.cb .tag.v{background:#0f3d66;color:#a9d6ff}body.cb .tag.r{background:#5a3305;color:#ffc98a}
body.cb .bar.gr i{background:linear-gradient(90deg,#1c6fc0,#7cc4ff)}body.cb .bar.rd i{background:linear-gradient(90deg,#b0651a,#ffbe6e)}
body.cb .btn.red{background:#4a2c06;border-color:#a4671c;color:#ffd9a8}
body.cb .pc-rar{font-size:11px;background:#000;color:#fff;outline:1px solid rgba(255,255,255,.6)}

/* ---------- Cinématiques ---------- */
.cn-tv{display:flex;gap:10px;align-items:center;font-family:var(--disp);font-size:18px;font-weight:700;text-transform:uppercase;margin-bottom:8px}.cn-tv b{background:var(--bad);color:#fff;padding:1px 9px;border-radius:5px;font-style:italic}.cn-tv span{color:var(--gold2)}
.cn-sc{position:relative;border-radius:16px;overflow:hidden;border:1px solid #2b3d6e;background:#0a1535}.cn-sc>svg{display:block;width:100%;height:auto}
.cn-cap{text-align:center;margin:12px 0;font-size:16px;font-weight:600}
.cn-bus{animation:cnBus 3.6s cubic-bezier(.15,.7,.2,1) both}@keyframes cnBus{from{transform:translate(-260px,150px)}to{transform:translate(184px,150px)}}
.cn-plane{animation:cnPl 3.8s cubic-bezier(.2,.6,.3,1) both}@keyframes cnPl{from{transform:translate(-220px,6px) rotate(9deg)}to{transform:translate(70px,196px) rotate(0deg)}}
.cn-fan.j{animation:cnJ .5s ease-in-out infinite alternate}@keyframes cnJ{to{transform:translateY(-7px)}}
.cn-fl{opacity:0;animation:cnF 1.3s steps(1) infinite}@keyframes cnF{0%{opacity:.95}10%{opacity:0}}
.cn-co{position:absolute;right:10%;bottom:17%;width:30%;max-width:190px}.cn-co .coachsvg{display:block;width:100%;height:auto;aspect-ratio:1;box-shadow:0 8px 30px rgba(0,0,0,.6)}.cn-co.sad{filter:saturate(.7)}
.cn-low{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:7px 14px;background:linear-gradient(90deg,#e9bb4d,rgba(233,187,77,.82));color:#1a1204;font-family:var(--disp)}.cn-low b{font-size:20px;text-transform:uppercase;font-style:italic}.cn-low span{font-size:14px;font-weight:600}
.cn-live{position:absolute;top:10px;left:12px;background:var(--bad);color:#fff;font-weight:700;font-size:12px;padding:2px 8px;border-radius:5px}
.cine .opt{width:100%}

/* ---------- Écran de départ ---------- */
#start{position:fixed;inset:0;z-index:40;overflow-y:auto;background:radial-gradient(900px 600px at 50% -10%,#16306e,#04060c 70%);padding:calc(24px + env(safe-area-inset-top,0px)) 16px 40px}
.st-in{max-width:880px;margin:0 auto}
.logo-t{font-family:var(--disp);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(60px,15vw,150px);line-height:.82;text-align:center;margin:6vh 0 8px;background:linear-gradient(180deg,#fff6d0,var(--gold) 50%,#8f6516);-webkit-background-clip:text;background-clip:text;color:transparent;animation:win .8s both}
.st-menu{display:flex;flex-direction:column;gap:12px;max-width:340px;margin:30px auto}
.cr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.prev{display:flex;gap:16px;align-items:center;justify-content:center;padding:14px}
.coachsvg{width:96px;height:96px;border-radius:50%;background:#0a1326;border:2px solid var(--gold)}

/* ---------- Responsive ---------- */
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-team{grid-template-columns:1fr}}
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-areas:"top" "main"}
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:30;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);gap:2px;scrollbar-width:none}
  #nav::-webkit-scrollbar{display:none}
  .brand{display:none}
  .nb{flex-direction:column;gap:1px;font-size:10.5px;padding:6px 9px;flex:none;min-width:62px;align-items:center}
  .nb.on{box-shadow:inset 0 -3px 0 var(--gold)}
  .nb.nd,.ngl{display:none}.nb.ngm{display:flex;flex:1 1 0;min-width:0;padding:6px 2px}
  .subnav{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 12px;padding:0 12px 2px;scrollbar-width:none}.subnav::-webkit-scrollbar{display:none}.subnav .tab{flex:none;padding:6px 12px;font-size:13px}
  #main{padding:14px 12px calc(96px + env(safe-area-inset-bottom,0px))}
  #top{padding:8px 12px}.tclub b{font-size:18px}
  .g2,.g3,.cr{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .pm{grid-template-columns:1fr}.pm>.pc{max-width:210px;margin:0 auto}
  .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .score{font-size:50px}.sb .tm{font-size:15px}
  .slot{width:54px}.slot .so{width:36px;height:36px;font-size:18px}.slot .sn{font-size:10px;max-width:58px}
  .bench{grid-template-columns:repeat(4,1fr)}
  .cmp{grid-template-columns:40px 1fr 84px 1fr 40px}
  h2{font-size:26px}
  /* Rien ne dépasse de l'écran : les blocs peuvent rétrécir, les champs et les boutons s'adaptent. */
  #main{overflow-x:hidden}
  .panel,.grid>*,.row>*,.fld,.li>*{min-width:0}
  .panel{overflow-wrap:break-word}
  select,input:not([type=color]):not([type=checkbox]):not([type=radio]):not([type=range]){max-width:100%;min-width:0}
  .fld{max-width:100%}
  .btn{white-space:normal}
  .kv b{overflow-wrap:anywhere}
  #toasts{left:10px;right:10px;top:auto;bottom:calc(74px + env(safe-area-inset-bottom,0px));max-width:none;gap:6px}
  .toast{font-size:13px;padding:8px 12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* Éditeur de joueurs et photos importées */
body.ygo{--bg:#07040c;--navy:#120a1c;--panel:#1a1026;--panel2:#26163a;--line:#4a2f6b;--blue:#a04dff}
img.face.ph.yg{border-radius:10px;object-position:50% 28%;border-color:var(--gold)}.ava img.face.ph.yg{border-radius:0}
.pc-yg{display:flex;justify-content:space-between;align-items:center;gap:4px;font-family:var(--disp);font-size:14px;background:rgba(0,0,0,.4);border-radius:6px;padding:3px 7px;margin:0 0 6px}.pc-yg b{font-size:17px}.pc-yg small{font-size:10px;opacity:.8;white-space:nowrap}
img.face.ph{border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.55);background:#0a1326}
.edph{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
label.btn{cursor:pointer;display:inline-flex;align-items:center}
.lnk{background:none;border:0;color:inherit;font:inherit;padding:0;cursor:pointer;text-align:left}
.lnk:hover{color:var(--gold)}

/* Virage des supporters (célébration de but), prêts, effectif des clubs */
.goalfx.vir{display:block;overflow:hidden;animation:gfx2 2.6s ease both;background:radial-gradient(circle at 50% 30%,rgba(233,187,77,.42),rgba(4,6,12,.8) 70%)}
.goalfx.vir b{display:block;line-height:1;font-size:clamp(80px,22vw,200px)}
.gtxt{position:absolute;left:0;right:0;top:7%;text-align:center;animation:gpop .5s cubic-bezier(.2,1.6,.4,1) both}
.gtxt span{display:block;margin-top:6px;font-family:var(--disp);font-weight:700;font-size:clamp(20px,5vw,42px);text-transform:uppercase;letter-spacing:.04em;color:var(--gold);text-shadow:0 2px 12px #000}
.virage{position:absolute;left:0;right:0;bottom:0;height:48%;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;background:linear-gradient(transparent,rgba(0,0,0,.75) 40%);animation:vup .45s ease-out both}
.vrow{display:flex;justify-content:center;gap:1%;padding:0 1%;position:relative;z-index:2}
.vrow:nth-of-type(odd){transform:translateX(1.6%)}
.vrow i{flex:1;max-width:36px;aspect-ratio:1/1.45;border-radius:42% 42% 5px 5px;background:radial-gradient(circle at 50% 24%,var(--s) 0 22%,transparent 23%),linear-gradient(var(--c),var(--c)) 50% 100%/100% 60% no-repeat;animation:vjump .4s ease-in-out infinite alternate;animation-delay:var(--d)}
.tifo{align-self:center;position:relative;z-index:2;margin-bottom:8px;padding:4px 20px;font-family:var(--disp);font-weight:800;font-size:clamp(15px,3.2vw,26px);text-transform:uppercase;letter-spacing:.1em;color:#fff;text-shadow:0 1px 3px #000;background:var(--c);border:3px solid var(--c2);animation:vjump .4s ease-in-out infinite alternate}
.flag{position:absolute;bottom:42%;width:20%;height:34%;z-index:1;background:repeating-linear-gradient(90deg,var(--c) 0 25%,var(--c2) 25% 50%);clip-path:polygon(0 0,100% 8%,93% 50%,100% 92%,0 100%);transform-origin:0 100%;animation:wave .7s ease-in-out infinite alternate}
.flag.f1{left:9%}.flag.f2{right:9%;transform-origin:100% 100%;animation-direction:alternate-reverse;clip-path:polygon(100% 0,0 8%,7% 50%,0 92%,100% 100%)}
.flare{position:absolute;bottom:18%;width:32%;height:95%;background:radial-gradient(ellipse at 50% 100%,rgba(255,70,50,.9),rgba(255,120,60,.35) 35%,transparent 70%);filter:blur(10px);animation:flare .9s ease-in-out infinite alternate}
.flare.l{left:-6%}.flare.r{right:-6%}
.flash{position:absolute;inset:0}
.flash u{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 14px 5px #fff;opacity:0;animation:tw .45s ease-in-out infinite}
.shake{animation:shake .5s}
@keyframes gfx2{0%{opacity:0}8%,86%{opacity:1}100%{opacity:0}}
@keyframes gpop{from{transform:scale(.3);opacity:0}}
@keyframes vup{from{transform:translateY(100%)}}
@keyframes vjump{to{transform:translateY(-36%)}}
@keyframes wave{from{transform:rotate(-16deg) skewY(4deg)}to{transform:rotate(12deg) skewY(-6deg)}}
@keyframes flare{to{opacity:.55;transform:scaleY(1.15)}}
@keyframes tw{50%{opacity:1}}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
.pc .inj.loan{background:#1d4ed8;left:auto;right:8px}
.sql{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.sql .li{width:100%}
@media (prefers-reduced-motion:reduce){.vrow i,.tifo,.flag,.flare,.flash u,.shake{animation:none}}

/* Match en direct, succès, emplacements de sauvegarde, accessibilité */
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--gold);color:#1a1204;padding:8px 14px;border-radius:0 0 10px 0;font-weight:700}

.mctl{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:10px}

.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;font-size:12px;color:var(--mut);text-align:center}

.mini b{display:block;font-family:var(--disp);font-size:19px;color:var(--text)}

/* Terrain 2D du match en direct */
.p2d{position:relative;width:100%;aspect-ratio:2.1/1;max-height:300px;margin:0 auto 10px;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.35);background:repeating-linear-gradient(90deg,#176b3c 0 10%,#14713e 10% 20%)}
.p2d::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.4)}
.p2d::after{content:"";position:absolute;left:50%;top:50%;height:34%;aspect-ratio:1;border:2px solid rgba(255,255,255,.4);border-radius:50%;transform:translate(-50%,-50%)}
.p2d .bx{position:absolute;top:24%;bottom:24%;width:13%;border:2px solid rgba(255,255,255,.4)}.p2d .bx.l{left:-2px}.p2d .bx.r{right:-2px}
.p2d .sb6{position:absolute;top:37%;bottom:37%;width:5%;border:2px solid rgba(255,255,255,.4)}.p2d .sb6.l{left:-2px}.p2d .sb6.r{right:-2px}
.p2d .psp,.p2d .cdot{position:absolute;top:50%;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.55);transform:translate(-50%,-50%)}.p2d .psp.l{left:10.5%}.p2d .psp.r{left:89.5%}.p2d .cdot{left:50%}
.p2d .arcw{position:absolute;top:0;bottom:0;width:9%;overflow:hidden;pointer-events:none}.p2d .arcw.l{left:13%}.p2d .arcw.r{right:13%}
.p2d .arcw span{position:absolute;top:50%;height:30%;aspect-ratio:1;border:2px solid rgba(255,255,255,.4);border-radius:50%;transform:translate(-50%,-50%)}.p2d .arcw.l span{left:-28%}.p2d .arcw.r span{left:128%}
.p2d .gol{position:absolute;top:44%;bottom:44%;width:1.3%;border:2px solid rgba(255,255,255,.85);background:repeating-linear-gradient(0deg,rgba(255,255,255,.28) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 1px,transparent 1px 4px)}.p2d .gol.l{left:-2px;border-left:0}.p2d .gol.r{right:-2px;border-right:0}
.p2d i{position:absolute;width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.6);transition:left var(--t,.24s) linear,top var(--t,.24s) linear}
.p2d i.b{width:9px;height:9px;background:#fff;border:1px solid #111;z-index:3;box-shadow:0 2px 3px rgba(0,0,0,.55)}
.p2d i.off{display:none}
.p2d i[data-u],.p2d i[data-o]{cursor:pointer}
.p2d i b{position:absolute;inset:0;display:grid;place-items:center;font:700 8px/1 var(--body);color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 1px #000;pointer-events:none}
.p2d i.lt{border-color:#14181f}.p2d i.lt b{color:#0b0f1a;text-shadow:none}
.p2d i.yc{box-shadow:0 0 0 2px #ffd83d,0 1px 3px rgba(0,0,0,.6)}
.p2d i.hl{z-index:2;box-shadow:0 0 0 3px #fff,0 0 12px 4px rgba(255,255,255,.7)}

.p2d i.hl.y{box-shadow:0 0 0 3px #ffd83d,0 0 12px 4px rgba(255,216,61,.75)}
.p2d i.hl.r{box-shadow:0 0 0 3px var(--bad),0 0 12px 4px rgba(255,91,108,.8)}
.p2d i.hl.in{box-shadow:0 0 0 3px var(--ok),0 0 12px 4px rgba(54,210,131,.75)}
.p2d em{position:absolute;z-index:4;transform:translate(-50%,-50%);padding:2px 8px;border-radius:999px;background:rgba(4,6,12,.88);border:1px solid rgba(255,255,255,.35);color:#fff;font:600 12px/1.3 var(--body);white-space:nowrap;pointer-events:none;max-width:70%;overflow:hidden;text-overflow:ellipsis}

@media (max-width:860px){.p2d i{width:13px;height:13px}.p2d i.b{width:7px;height:7px}.p2d i b{font-size:7px}.p2d em{font-size:11px}}

/* ---------- Assistant·e du club ---------- */
#sec{position:fixed;left:0;bottom:0;z-index:55;pointer-events:none;--px:0;--py:0;--dir:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}

#sec .arm,#sec .head,#sec .leg{transition:transform .25s}
#sec .up{animation:secBreath 3.6s ease-in-out infinite}
#sec .pu{transform:translate(calc(var(--px)*1px),calc(var(--py)*1px))}
#sec .head{transform:translate(calc(var(--px)*.5px),0) rotate(calc(var(--px)*1.5deg))}

#sec.walk .leg.l{animation:secLeg .46s ease-in-out infinite alternate}

#sec.walk .arm.l{animation:secSw .46s ease-in-out infinite alternate}
#sec.walk svg{transform:rotate(calc(var(--dir)*2.5deg))}

#sec.cheer .arm.l,#sec.wave .arm.l{animation:secWave .3s ease-in-out infinite alternate}

#sec.sad .head{transform:translateY(3px) rotate(7deg)}

#sec.still *{animation:none!important;transition:none!important}

@keyframes secPose{0%,100%{transform:translateY(0) rotate(-1.1deg)}50%{transform:translateY(-1.3px) rotate(1.1deg)}}
#sec.act-pose .up{transform-origin:60px 168px;transform:rotate(4deg);animation:none}#sec.act-pose .leg.r{transform:rotate(-6deg)}#sec.act-pose .arm.l{transform:rotate(12deg)}#sec.act-pose .arm.st{transform:rotate(-24deg)}#sec.act-pose .head{transform:rotate(-6deg)}
#sec.kiss .m1{display:none}#sec.kiss .m4{display:block}#sec.kiss .lid.r{animation:none;transform:scaleY(1)}
#sec.wink .lid.r{animation:none;transform:scaleY(1)}
@keyframes secBlink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes secBreath{50%{transform:translateY(-1.3px)}}
@keyframes secLeg{from{transform:rotate(15deg)}to{transform:rotate(-15deg)}}
@keyframes secBob{to{transform:translateY(-2.5px)}}
@keyframes secSw{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes secWave{from{transform:rotate(148deg)}to{transform:rotate(172deg)}}

/* ---------- État global ---------- */
let S = null;
let QUIET = null;          // pendant un match : collecte les messages au lieu d'afficher des toasts
let usedNames = new Set();

/* =====================================================================
   JOUEURS
   ===================================================================== */
const ATT = p => av(p.a), MID = p => av(p.m), DEF = p => av(p.d);
/* Thème Yu-Gi-Oh! : l'ATK et la DEF du monstre comptent en match.
   YG_K points d'ATK (ou de DEF) = +1 % ; plafond de YG_MAX % par joueur. Sans effet si le thème est désactivé. */
const YG_K = 1000, YG_MAX = 4;
const ygB = (p, k) => p && p.yg && S && S.set && S.set.ygo ? Math.min(YG_MAX, Math.max(0, +p.yg[k] || 0) / YG_K) : 0;   // k : 'a' (ATK) ou 'd' (DEF)
const ygF = (p, k) => 1 + ygB(p, k) / 100;
const ygTxt = (p, k) => '+' + String(Math.round(ygB(p, k) * 10) / 10).replace('.', ',') + ' %';
/** Note d'un joueur à un poste donné (combinaison pondérée des statistiques). */
function ovrAt(p, pos) { if (pos === 'GK') return p.g; const w = POS[pos].w; return w[0] * ATT(p) + w[1] * MID(p) + w[2] * DEF(p); }
const ovr = p => Math.round(ovrAt(p, p.pos));
/** Valeur marchande : exponentielle selon la note, modulée par l'âge et le potentiel. */
function value(p) {
  const o = ovr(p), af = p.age <= 21 ? 1.25 : p.age <= 25 ? 1.15 : p.age <= 29 ? 1 : p.age <= 32 ? .75 : .45;
  return Math.max(50000, Math.round(150000 * Math.pow(1.18, o - 50) * af * (1 + (p.pot - o) * .015) / 10000) * 10000);
}
const baseWage = p => Math.round(value(p) * .0015 / 100) * 100;
const wage = p => p.w || baseWage(p);              // salaire négocié s'il existe, sinon salaire de marché
const xpNeed = p => 800 + p.lv * 400;
const pById = id => S.players.find(p => p.id === id);
const poolP = id => S.pool.find(p => p.id === id);

function tierOvr() { const r = rnd(); return r < .25 ? RI(52, 61) : r < .55 ? RI(62, 69) : r < .77 ? RI(70, 76) : r < .9 ? RI(77, 82) : r < .97 ? RI(83, 88) : RI(89, 94); }

function genPlayer(id, pos, T, age) {
  const ni = Math.floor(rnd() * NATS.length), N = NATS[ni]; let n, k = 0;
  do { n = pick(N.fn) + ' ' + pick(N.ln); } while (usedNames.has(n) && ++k < 30);
  usedNames.add(n);
  age = age || RI(17, 35);
  const g = b => Array.from({ length: 5 }, () => clamp(Math.round(b + RI(-5, 5)), 5, 99));
  const p = { id, n, age, nat: ni, pos, lv: 1, xp: 0, pts: 0, ct: RI(2, 4), lg: rnd() < .7 ? N.lg : RI(0, 5), cl: RI(0, 5), ty: RI(0, 4), sk: RI(0, 4), hr: RI(0, 4), hs: RI(0, 5), bd: RI(0, 2), en: 100, inj: 0, apps: 0, gl: 0, e: clamp(T + RI(-8, 10), 30, 99) };
  if (pos === 'GK') { p.a = g(T - 55); p.m = g(T - 38); p.d = g(T - 40); p.g = T; }
  else { const o = POS[pos].o; p.a = g(T + o[0]); p.m = g(T + o[1]); p.d = g(T + o[2]); p.g = RI(5, 15); }
  const o = ovr(p); p.pot = clamp(o + (age < 24 ? RI(2, 12) : age < 28 ? RI(0, 4) : 0), o, 97);
  return p;
}
/** Progression : +1 sur les statistiques clés du poste. */
function grow(p) {
  if (p.pos === 'GK') { p.g = Math.min(99, p.g + 1); return; }
  POS[p.pos].w.forEach((w, i) => { if (w >= .3) { const k = 'amd'[i]; p[k] = p[k].map(x => Math.min(99, x + 1)); } });
}
function gainXP(p, x) {
  p.xp += x; let up = false;
  while (p.xp >= xpNeed(p)) { p.xp -= xpNeed(p); p.lv++; p.pts++; if (ovr(p) < p.pot) grow(p); up = true; }
  if (up) notify('📈', p.n + ' monte au niveau ' + p.lv + ' !');
}
/** Dépense un point de compétence sur un groupe de statistiques. */
function spendPoint(id, k) {
  const p = pById(id); if (!p || p.pts < 1) return;
  if (k === 'g') p.g = Math.min(99, p.g + 1); else if (k === 'e') p.e = Math.min(99, p.e + 3); else p[k] = p[k].map(x => Math.min(99, x + 1));
  p.pts--; save();
}
/** Vieillissement de fin de saison. */
function ageing(p) {
  p.age++;
  if (p.age <= 24 && ovr(p) < p.pot) { for (let k = RI(1, 2); k--;) grow(p); }
  else if (p.age >= 31) {
    const n = RI(0, p.age >= 34 ? 2 : 1);
    if (n) { p.a = p.a.map(x => Math.max(5, x - n)); p.d = p.d.map(x => Math.max(5, x - n)); if (p.pos === 'GK' && p.age >= 34) p.g = Math.max(30, p.g - n); p.e = Math.max(20, p.e - 2); }
  }
}

let SLOT = 1; try { SLOT = clamp(+localStorage.getItem('league_master_slot') || 1, 1, 3); } catch (e) { }
const slotKey = i => SAVE_KEY + (i > 1 ? '_' + i : '');       // l'emplacement 1 garde l'ancienne clé : les sauvegardes existantes restent lisibles
const setSlot = i => { SLOT = i; try { localStorage.setItem('league_master_slot', i); } catch (e) { } };
function save() { if (M.L) return true; try { if (S && S.players) stampSquad(); localStorage.setItem(slotKey(SLOT), JSON.stringify(S)); return true; } catch (e) { return false; } }   // rien n'est écrit pendant un match en cours
function slotInfo(i) { try { const s = JSON.parse(localStorage.getItem(slotKey(i)) || 'null'); return s && s.v === 1 ? s : null; } catch (e) { return null; } }
function loadGame(i) { if (i) setSlot(i); const s = slotInfo(SLOT); if (!s) return false; try { S = s; migrate(); return true; } catch (e) { S = null; return false; } }
function resetSave(i) { try { localStorage.removeItem(slotKey(i || SLOT)); } catch (e) { } if (!i || i === SLOT) S = null; }

/* =====================================================================
   NOUVELLE PARTIE
   ===================================================================== */
function newGame(cfg) {
  usedNames = new Set(); let id = 1; const pool = [];
  const add = (pos, n) => { for (let i = 0; i < n; i++) pool.push(genPlayer(id++, pos, tierOvr())); };
  add('GK', 50); add('CB', 50); add('LB', 25); add('RB', 25);           // 50 gardiens, 100 défenseurs
  add('CDM', 30); add('CM', 40); add('CAM', 30);                         // 100 milieux
  add('LW', 30); add('RW', 30); add('ST', 40);                           // 100 attaquants
  S = {
    v: 1, club: { name: cfg.name, c1: cfg.c1, c2: cfg.c2, logo: cfg.logo, lvl: 1, xp: 0 },
    coach: Object.assign({ lvl: 1, xp: 0, pref: '4-3-3' }, cfg.coach),
    div: 3, oth: {}, diff: cfg.diff, budget: DIFF[cfg.diff].bud, fans: 8000, rep: 20, stad: 0, season: 1, nid: id,
    pool, players: [], formation: '4-3-3', style: 'poss', xi: Array(11).fill(null), bench: Array(7).fill(null), cap: null,
    teams: [], fix: [], cal: [], ci: 0, comp: {}, qual: { cl: false, sc: false }, opp: null, ended: null, lastRound: [],
    form: [], results: [], fin: [], budHist: [], notifs: [], inv: {}, act: [], trophies: [], hist: [],
    market: [], mkIn: 3, offers: [], neg: {}, set: { speed: 1, anim: true }, nextAt: 0, rec: { w: 0, d: 0, l: 0 }
  };
  if (cfg.carry) { const c = cfg.carry; Object.assign(S, { trophies: c.trophies, hist: c.hist, rec: c.rec, ach: c.ach, recs: c.recs, season: c.season + 1, leg: c.leg || [], cid: (c.cid || 1) + 1, awards: c.awards || [], bo: c.bo || [], ws: c.ws || [] }); Object.assign(S.set, c.set); }   // nouveau club après un licenciement
  // Effectif de départ : 20 joueurs modestes
  ['GK', 'GK', 'CB', 'CB', 'CB', 'CB', 'LB', 'LB', 'RB', 'CDM', 'CM', 'CM', 'CM', 'CAM', 'LW', 'LW', 'RW', 'RW', 'ST', 'ST'].forEach(pos => {
    const t = RI(58, 66), c = S.pool.filter(p => p.pos === pos).sort((a, b) => Math.abs(ovr(a) - t) - Math.abs(ovr(b) - t))[0];
    S.pool = S.pool.filter(p => p !== c); c.ct = RI(2, 4); S.players.push(c);
  });
  S.teams = [{ id: 0, name: cfg.name, u: 1 }].concat(D3TEAMS.slice(0, 15).map((n, i) => {
    const b = 58 + i * 11 / 14; return { id: i + 1, name: n, a: b + R(-2, 2), m: b + R(-2, 2), d: b + R(-2, 2), coh: RI(55, 85), c: TCOL[i % TCOL.length] };
  }));
  migrate(); S.oth = { 1: genDivision(LTEAMS.concat(EXTRA_T[0]), 64, 82), 2: genDivision(D2TEAMS, 63, 74) }; worldInit();      // les divisions supérieures à conquérir
  autoXI(); startSeason(); refreshMarket(true); setObjective();
  S.budHist.push(S.budget); S.nextAt = Date.now() + RI(3600, 10800) * 1000;
  notify('🔔', 'Bienvenue, coach ! Objectif de la direction : ' + S.board.obj.txt.toLowerCase() + '.');
  save();
}

/* =====================================================================
   FINANCES, NOTIFICATIONS, NIVEAUX
   ===================================================================== */
/** Mouvement d'argent inscrit à l'historique financier. */
function money(a, label, k) {
  a = Math.round(a); if (!a) return; S.budget += a; ffpTrack(a, label, k);
  S.fin.unshift({ a, l: label, s: S.season, k: k || 'd' }); if (S.fin.length > 90) S.fin.length = 90;
}
function notify(i, t) {
  S.notifs.unshift({ i, t, u: 1 }); if (S.notifs.length > 40) S.notifs.length = 40;
  if (QUIET) QUIET.push(i + ' ' + t); else if (typeof toast === 'function') toast(i + ' ' + t);
}
const clubNeed = l => Math.round(250 * Math.pow(l, 1.35));
const coachNeed = l => Math.round(300 * Math.pow(l, 1.3));
function addClubXP(x) {
  const c = S.club; c.xp += Math.round(x);
  while (c.lvl < 50 && c.xp >= clubNeed(c.lvl)) {
    c.xp -= clubNeed(c.lvl); c.lvl++;
    const u = UNLOCKS.find(u => u[0] === c.lvl);
    notify('⭐', 'Club niveau ' + c.lvl + ' !' + (u ? ' Débloqué : ' + u[1] + '.' : ''));
  }
}
function addCoachXP(x) {
  const c = S.coach; c.xp += Math.round(x);
  while (c.xp >= coachNeed(c.lvl)) { c.xp -= coachNeed(c.lvl); c.lvl++; notify('👔', 'Votre coach passe au niveau ' + c.lvl + ' : ses bonus augmentent.'); }
}
function trophy(n) {
  S.trophies.push({ n, s: S.season }); addClubXP(500); if (S.board) S.board.conf = clamp(S.board.conf + 15, 0, 100);
  const g = Math.round(3000 + S.fans * .04); S.fans += g;
  notify('🏆', 'Trophée remporté : ' + n + ' ! +' + g.toLocaleString('fr-FR') + ' supporters.');
}
const fanTier = () => { let t = 0; FANT.forEach((x, i) => { if (S.fans >= x.min) t = i; }); return t; };
const stars = () => S.players.filter(p => ovr(p) >= 80).length;
/** Économie courante : recettes et dépenses par match. */
function econ() {
  const st = STAD[S.stad], tk = TICK[S.tk == null ? 2 : S.tk][0], att = Math.min(st.cap, Math.round((S.fans * .45 + 1500) * (1.5 - .5 * tk) * (.85 + (S.fm == null ? 60 : S.fm) * .0025))), price = Math.round((25 + S.stad * 5) * tk);
  return {
    att, price, ticket: att * price, sponsor: Math.round((30000 + S.fans * .35) * (1 + S.rep / 100) * (S.spon ? S.spon.fix : 1)), merch: Math.round(S.fans * .08),
    wages: S.players.reduce((s, p) => s + wage(p), 0), staff: staffWage(), upkeep: Math.round(st.cap * 1.2)
  };
}
/** Amélioration du stade : vérifie le niveau du club et le budget. */
function upgradeStadium() {
  const n = STAD[S.stad + 1]; if (!n) return 'Le stade est déjà au niveau maximum.';
  if (S.club.lvl < n.lv) return 'Club niveau ' + n.lv + ' requis.';
  if (S.budget < n.cost) return 'Budget insuffisant : il manque ' + Math.round((n.cost - S.budget) / 1000).toLocaleString('fr-FR') + ' k€.';
  money(-n.cost, 'Agrandissement du stade (niveau ' + (S.stad + 2) + ')', 's'); S.stad++; S.stadN = 0;
  S.fans += Math.round(n.cap * .15); addClubXP(300);
  notify('🏟️', 'Stade amélioré : ' + n.cap.toLocaleString('fr-FR') + ' places.'); checkAch(); save(); return null;
}

/* =====================================================================
   COMPOSITION, PUISSANCE ET COHÉSION
   ===================================================================== */
const enF = p => (.85 + .15 * p.en / 100) * (p.inj ? .6 : 1) * (.965 + .05 * (p.mo == null ? 70 : p.mo) / 100);   // énergie, blessure, moral
function greedy(players) {
  const F = FORM[S.formation], pairs = [];
  players.forEach(p => F.forEach((s, i) => pairs.push([ovrAt(p, s[0]) * enF(p) + (natP(p, s[0]) ? 3 : 0), i, p.id])));
  pairs.sort((a, b) => b[0] - a[0]);
  const xi = Array(11).fill(null), used = new Set();
  pairs.forEach(([v, i, id]) => { if (xi[i] === null && !used.has(id)) { xi[i] = id; used.add(id); } });
  return xi;
}
/** Meilleur onze + banc automatiques. */
function autoXI() {
  const fit = S.players.filter(p => !p.inj && !p.sus);
  S.xi = greedy(fit);
  const rest = fit.filter(p => !S.xi.includes(p.id)).sort((a, b) => ovr(b) - ovr(a));
  const gk = rest.find(p => p.pos === 'GK'), b = gk ? [gk] : [];
  rest.forEach(p => { if (b.length < 7 && p !== gk) b.push(p); });
  S.bench = Array.from({ length: 7 }, (_, i) => b[i] ? b[i].id : null);
  if (!S.cap || !S.xi.includes(S.cap)) { const c = S.xi.map(pById).filter(Boolean).sort((a, b) => b.age - a.age)[0]; S.cap = c ? c.id : null; }
}
/** Changement de formation : les titulaires actuels sont replacés au mieux. */
function setFormation(f) { const cur = S.xi.map(pById).filter(Boolean); S.formation = f; S.xi = greedy(cur); S.tac.roles = Array(11).fill('std'); S.tac.ins = Array(11).fill('none'); save(); }
/** Place un joueur sur un poste (titulaire ou banc) en échangeant si besoin. */
function place(kind, i, id) {
  const arr = kind === 'xi' ? S.xi : S.bench, cur = arr[i];
  if (id === null) { arr[i] = null; save(); return; }
  const x = S.xi.indexOf(id), b = S.bench.indexOf(id);
  if (x >= 0) S.xi[x] = cur || null; else if (b >= 0) S.bench[b] = cur || null;
  arr[i] = id; save();
}
function pts5() { const f = S.form.slice(-5); return f.length ? f.reduce((s, r) => s + (r === 'V' ? 3 : r === 'N' ? 1 : 0), 0) * 5 / f.length : 7; }
function table() { return S.teams.slice().sort((a, b) => b.pts - a.pts || (b.GF - b.GA) - (a.GF - a.GA) || b.GF - a.GF || a.id - b.id); }
const myPos = () => table().findIndex(t => t.id === 0) + 1;
function forme() { const ps = S.xi.map(pById).filter(Boolean); return Math.round(.5 * (ps.length ? av(ps.map(p => p.en)) : 50) + .5 * (40 + pts5() * 4)); }
/** Moral de l'équipe : résultats récents et classement (60 %), moral individuel des titulaires (40 %). */
function moral() { const xi = S.xi.map(pById).filter(Boolean); return Math.round(clamp(.6 * (45 + pts5() * 3 + (8 - myPos()) * 1.2) + .4 * (xi.length ? av(xi.map(mo)) : 60), 10, 100)); }
const energy = () => { const ps = S.xi.map(pById).filter(Boolean); return Math.round(ps.length ? av(ps.map(p => p.en)) : 0); };

/** Cohésion : postes, nationalités, ligue, anciens coéquipiers, style, automatismes, coach, capitaine. */
function cohesion() {
  const F = FORM[S.formation], ps = S.xi.map(pById), st = STYLES[S.style];
  let posF = 0, nat = 0, lg = 0, cl = 0, sty = 0, rel = 0, n = 0;
  ps.forEach((p, i) => {
    if (!p) return; n++;
    if (natP(p, F[i][0])) posF++; else if (POS[p.pos].l === POS[F[i][0]].l) posF += .5;
    if (st.t.includes(p.ty)) sty++;
    rel += Math.min(p.apps, 20) / 20;
    for (let j = i + 1; j < 11; j++) { const q = ps[j]; if (!q) continue; if (p.nat === q.nat) nat++; if (p.lg === q.lg) { lg++; if (p.cl === q.cl) cl++; } }
  });
  const parts = [['Postes naturels', posF * 2.4, 26], ['Nationalités communes', nat * 1.5, 14], ["Même ligue d'origine", lg * .5, 8], ['Anciens coéquipiers', cl * 1.5, 6],

/** Réduit l'image importée à un carré de 128 px (JPEG) pour tenir dans la sauvegarde. */
function readPhoto(file, cb) {
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    const s = Math.min(im.width, im.height), cv = document.createElement('canvas'); cv.width = cv.height = 128;
    cv.getContext('2d').drawImage(im, (im.width - s) / 2, Math.max(0, (im.height - s) / 4), s, s, 0, 0, 128, 128);
    cb(cv.toDataURL('image/jpeg', .82));
  }; im.onerror = () => toast('⚠️ Image illisible.'); im.src = r.result; };
  r.readAsDataURL(file);
}
function applyEdit(id) {
  const p = anyP(id); if (!p) return;
  const v = (i, lo, hi, d) => { const x = Math.round(+$('#' + i).value); return isNaN(x) ? d : clamp(x, lo, hi); };
  const shift = (arr, t) => { const dlt = t - Math.round(av(arr)); return arr.map(x => clamp(x + dlt, 1, 99)); };
  p.n = $('#edn').value.trim() || p.n; p.age = v('edage', 15, 45, p.age); p.pos = $('#edpos').value; p.nat = +$('#ednat').value;
  p.a = shift(p.a, v('eda', 1, 99, av(p.a))); p.m = shift(p.m, v('edm', 1, 99, av(p.m))); p.d = shift(p.d, v('edd', 1, 99, av(p.d)));
  p.g = v('edg', 1, 99, p.g); p.e = v('ede', 1, 99, p.e);
  p.sk = +$('#edsk').value; p.hr = +$('#edhr').value; p.hs = +$('#edhs').value; p.bd = +$('#edbd').value;
  p.pot = Math.max(ovr(p), v('edpot', 1, 99, p.pot));
  if (ED.ph) p.ph = ED.ph; else delete p.ph;
  { const tm = p.t != null && !pById(p.id) ? teamOf(p) : null; if (tm && !tm.u) { aiSync(tm); oppRefresh(tm); } }
  ED = null;
  if (!save()) { delete p.ph; save(); toast('⚠️ Sauvegarde pleine : photo non enregistrée. Retirez quelques photos.'); } else toast('Joueur modifié.');
  render(); playerModal(id);
}

/* ---------- Classements individuels : passeurs et gardiens ---------- */
function squadAssist(t, sc) {
  const sq = S.pool.filter(p => p.t === t.k && p.pos !== 'GK' && p !== sc); if (sq.length < 7) return null;
  const w = sq.map(p => [0, 1, 4, 3][lineOf(p.pos)] * MID(p)); let r = rnd() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < sq.length; i++) { r -= w[i]; if (r <= 0) return sq[i]; } return sq[0];
}
/** Gardien titulaire d'un club géré par le jeu : un match de plus, les buts encaissés, et le clean sheet éventuel. */
function creditGK(t, ga) {
  if (!t || t.u) return; let g = null;
  S.pool.forEach(p => { if (p.t === t.k && p.pos === 'GK' && (!g || p.g > g.g)) g = p; });
  if (!g) return; g.gm = (g.gm || 0) + 1; g.gc = (g.gc || 0) + ga; if (!ga) g.cs = (g.cs || 0) + 1;
}
/** Classement d'une statistique (sa : passes décisives, cs : matchs sans but encaissé) pour un ensemble de clubs. */
function rankList(key, ks, mine, n) {
  return S.pool.filter(p => p[key] && ks.has(p.t)).map(p => [p, (teamOf(p) || { name: 'Sans club' }).name, 0])
    .concat(mine ? S.players.filter(p => p[key]).map(p => [p, S.club.name, 1]) : [])
    .sort((a, b) => b[0][key] - a[0][key] || (a[0].gc || 0) - (b[0].gc || 0)).slice(0, n);
}
function rankPanel(key, ks, mine, dv) {
  const l = rankList(key, ks, mine, 8), gk = key === 'cs';
  return `<div class="panel"><h3>${gk ? 'Meilleurs gardiens' : 'Meilleurs passeurs'} <small>${dv ? 'Division ' + dv : 'saison ' + S.season}</small></h3>${l.map(([p, c, me], i) => `<div class="li"><span class="tag${me ? ' g' : ''}">${i + 1}</span>${ava(p, 30)}<span>${me ? esc(p.n) : `<button class="lnk" data-a="player" data-id="${p.id}">${esc(p.n)}</button>`}<br><small class="mut">${esc(c)} · ${p.pos}${gk ? ' · ' + (p.gc || 0) + ' but' + ((p.gc || 0) > 1 ? 's' : '') + ' encaissé' + ((p.gc || 0) > 1 ? 's' : '') + ' en ' + (p.gm || 0) + ' match' + ((p.gm || 0) > 1 ? 's' : '') : ''}</small></span><b class="sp num">${p[key]}</b></div>`).join('') || `<p class="mut">${gk ? 'Aucun match sans but encaissé pour le moment.' : 'Aucune passe décisive pour le moment.'}</p>`}</div>`;
}
function rankTable(key) {
  const ks = new Set(S.teams.map(t => t.k)), l = rankList(key, ks, true, 15), gk = key === 'cs';
  return `<div class="panel scroll-x"><h3>${gk ? 'Gardiens : matchs sans but encaissé' : 'Meilleurs passeurs'} <small>saison ${S.season}, Division ${S.div}</small></h3>${l.length ? `<table class="tb"><tr><th>#</th><th>Joueur</th><th>${gk ? 'Matchs' : 'Poste'}</th>${gk ? '<th>Buts encaissés</th>' : ''}<th>${gk ? 'Sans but encaissé' : 'Passes décisives'}</th></tr>${l.map(([p, c, me], i) => `<tr class="${me ? 'me' : ''}"><td>${i + 1}</td><td>${esc(p.n)}<br><small class="mut">${esc(c)}</small></td><td>${gk ? p.gm || 0 : p.pos}</td>${gk ? `<td>${p.gc || 0}</td>` : ''}<td><b>${p[key]}</b></td></tr>`).join('')}</table>` : `<div class="empty">${gk ? 'Aucun gardien n\'a encore gardé sa cage inviolée.' : 'Aucune passe décisive cette saison.'}</div>`}</div>`;
}

/* ---------- Corners : tireur et combinaison ---------- */
const CRN = {
  mix: ['Varié', 'Sans consigne : le tireur choisit, la cible est votre meilleur joueur de tête.'],
  pp: ['Premier poteau', 'Ballon tendu et rapide : la cible est choisie pour sa vitesse et sa finition plutôt que pour son physique.'],
  sp: ['Second poteau', 'Ballon flottant et défenseurs montés : +25 % de buts sur corner, mais un contre adverse peut partir dans votre dos.'],
  court: ['Joué court', 'Vous gardez le ballon : moins de buts directs, aucun risque de contre, et le but revient à un attaquant bien servi.']
};
/** Joue un corner pour le club selon la combinaison choisie. */
function liveCorner(m) {
  const L = M.L, cr = CRN[S.tac.cr] ? S.tac.cr : 'mix', p = taker('co'); L.st.corners[0]++; if (!p) return;
  const sk = q => cr === 'pp' ? (q.a[1] + q.a[2]) / 2 : q.d[4];
  if (cr === 'court') {
    const h = liveAtt();
    if (h && h.id !== p.id && rnd() < clamp(.02 + (setSkill(p, 'co') - 65) / 900, .01, .045)) liveGoal(0, n => 'BUT ! Corner joué court, ' + p.n + ' décale et ' + n + ' conclut !', h, p);
    else if (rnd() < .25) lev(m, 'cor', 0, '🚩', 'Corner joué court par ' + p.n + ' : ' + S.club.name + ' conserve le ballon.');
    return;
  }
  const h = livePick((q, l) => ({ A: 3, M: 1, D: 3, G: 0 }[l]) * sk(q));
  if (h && h.id !== p.id && rnd() < clamp((.03 + (setSkill(p, 'co') - 65) / 900 + (sk(h) - 65) / 900) * (cr === 'sp' ? 1.25 : 1), .015, .085)) return liveGoal(0, n => 'BUT ! Corner de ' + p.n + (cr === 'pp' ? ' au premier poteau, ' + n + ' coupe la trajectoire !' : cr === 'sp' ? ' au second poteau, coup de tête victorieux de ' + n + ' !' : ', coup de tête victorieux de ' + n + ' !'), h, p);
  if (cr === 'sp' && rnd() < .012) return liveGoal(1, n => 'Contre éclair après votre corner : but de ' + n + ' pour ' + L.o.name + '.');
  if (rnd() < .3) lev(m, 'cor', 0, '🚩', 'Corner pour ' + S.club.name + pick([' : la défense se dégage.', ' : le gardien capte le ballon.', ' : la tête passe à côté.']));
}

/* ---------- Fair-play financier ----------
   Sur une saison, le coût de l'effectif (salaires + achats − ventes, commissions comprises)
   ne doit pas dépasser 85 % des recettes, augmentées de la moitié de la trésorerie de départ. */
const FFP_R = .85;
const ffpNew = () => ({ rev: 0, wg: 0, tr: 0, cash: Math.max(0, S.budget || 0), n: 0, ban: 0, pen: null, last: null, warn: 0 });
function ffpTrack(a, l, k) {
  const f = S.ffp; if (!f) return;
  if (k === 't') f.tr -= a; else if (k === 'w') f.wg -= a;
  else if (a > 0 && !/Prêt bancaire/.test(l)) f.rev += a;
}
const ffpLim = (rev, cash) => Math.max(2e6, FFP_R * rev + .5 * cash);
const ffpBan = () => !!(S.ffp && S.ffp.ban >= S.season);
/** Projection de fin de saison : ce qui est déjà joué, plus les matchs restants au rythme actuel. */
function ffpProj() {
  const f = S.ffp, ec = econ(), rem = S.ended ? S.cal.filter(e => e.c === 'L').length : S.cal.slice(S.ci).filter(e => !e.res && e.c !== 'F' && (e.c === 'L' || (S.comp[e.c] && S.comp[e.c].alive))).length;
  const rev = f.rev + rem * (ec.ticket * .5 + ec.sponsor + ec.merch), wg = f.wg + rem * (ec.wages + staffWage()), cost = Math.max(0, wg + f.tr), lim = ffpLim(rev, f.cash);
  return { rev, wg, cost, lim, rem, k: cost / lim };
}
function ffpCheck() {
  const f = S.ffp; if (!f || f.warn) return; const p = ffpProj();
  if (p.k > 1) { f.warn = 1; notify('⚖️', 'Fair-play financier : à ce rythme, le coût de votre effectif dépassera le plafond autorisé de ' + eur(p.cost - p.lim) + ' en fin de saison. Vendez ou allégez les salaires pour éviter une sanction.'); }
}
/** Bilan de fin de saison : amende, puis interdiction de recrutement, puis retrait de points en cas de récidive. */
function ffpSeason() {
  const f = S.ffp; if (!f) return null;
  const cost = Math.max(0, f.wg + f.tr), lim = ffpLim(f.rev, f.cash), over = cost - lim, r = { cost, lim, rev: f.rev, ok: over <= 0, lv: 0, fine: 0, s: S.season };
  if (over > 0) {
    f.n = Math.min(3, f.n + 1); r.lv = f.n; r.fine = Math.round(clamp(over * .2, 1e5, 3e7) / 1e4) * 1e4;
    money(-r.fine, 'Amende · fair-play financier', 'd'); bconf(-8);
    if (f.n >= 2) f.ban = S.season + 1;
    if (f.n >= 3) f.pen = { n: 6, s: S.season + 1 };
    notify('⚖️', 'Fair-play financier : dépassement de ' + eur(over) + '. Amende de ' + eur(r.fine) + (f.n >= 3 ? ', interdiction de recrutement payant et 6 points de pénalité la saison prochaine.' : f.n >= 2 ? ' et interdiction de recrutement payant jusqu\'à la fin de la saison prochaine.' : '. Une récidive entraînera une interdiction de recrutement.'));
    news(S.club.name + ' sanctionné pour ses comptes', 'L\'instance de contrôle financier épingle le club : le coût de l\'effectif (' + eur(cost) + ') dépasse le plafond autorisé (' + eur(lim) + '). ' + (f.n >= 2 ? 'Récidiviste, le club est privé de recrutement payant.' : 'Premier avertissement, assorti d\'une amende.'), 'neg');
  } else if (f.n) { f.n--; notify('⚖️', 'Fair-play financier : comptes conformes cette saison. Votre dossier s\'allège.'); }
  f.last = r; f.rev = 0; f.wg = 0; f.tr = 0; f.warn = 0; f.cash = Math.max(0, S.budget);
  return r;
}
function ffpHTML() {
  const f = S.ffp; if (!f) return ''; const p = ffpProj(), pc = Math.round(p.k * 100), L = f.last;
  return `<h3 style="margin-top:16px">⚖️ Fair-play financier <small>${f.n ? 'dossier : ' + f.n + ' infraction' + (f.n > 1 ? 's' : '') : 'dossier vierge'}</small></h3>
<div class="kv"><span>Recettes projetées sur la saison</span><b class="ok">${eur(p.rev)}</b><span>Salaires projetés</span><b>${eur(p.wg)}</b><span>Transferts (achats − ventes)</span><b class="${f.tr > 0 ? 'bad' : 'ok'}">${eur(f.tr)}</b><span>Coût de l'effectif</span><b>${eur(p.cost)}</b><span>Plafond autorisé</span><b>${eur(p.lim)}</b><span>Utilisation du plafond</span><b class="${pc > 100 ? 'bad' : pc > 85 ? 'gold' : 'ok'}">${pc} %</b></div>
${bar(Math.min(100, pc), pc > 100 ? 'rd' : pc > 85 ? 'gd' : 'gr')}
${ffpBan() ? `<p class="bad" style="margin-top:8px">Interdiction de recrutement payant jusqu'à la fin de la saison ${f.ban} : seuls les joueurs libres et les prêts peuvent signer.</p>` : ''}${f.pen && f.pen.s >= S.season ? `<p class="bad" style="margin-top:6px">Pénalité de ${f.pen.n} points au classement pour la saison ${f.pen.s}.</p>` : ''}
${L ? `<p class="mut" style="margin-top:8px">Saison ${L.s} : ${L.ok ? 'comptes conformes' : 'dépassement, amende de ' + eur(L.fine)} (coût ${eur(L.cost)} pour un plafond de ${eur(L.lim)}).</p>` : ''}
<p class="mut" style="margin-top:6px">Règle : sur une saison, salaires et transferts nets (commissions d'agents comprises) ne doivent pas dépasser 85 % de vos recettes, plus la moitié de votre trésorerie de début de saison. Le stade et le centre de formation ne comptent pas. Sanctions : amende, puis interdiction de recrutement, puis 6 points de pénalité.</p>`;
}

/* ---------- Agents de joueurs ---------- */
const AGENTS = [['Sans agent', 0, 'Le joueur gère seul sa carrière : aucune commission.'], ['Agent familial', .03, 'Un proche du joueur : commission modeste.'], ['Agent établi', .06, 'Un professionnel reconnu : commission classique.'], ['Super-agent', .1, 'Commission élevée, et il alerte volontiers d\'autres clubs pour faire monter les enchères.']];

/* ---------- Rumeurs de transfert ---------- */
function rumAdd(r) {
  r.s = S.season; r.src = rnd() < (r.real ? .75 : .3) ? 1 : 0; S.rum.unshift(r); if (S.rum.length > 8) S.rum.length = 8;
  if (r.mine) { notify('🗞️', 'Rumeur : ' + r.cn + ' s\'intéresserait à ' + r.n + '.'); news('Mercato : ' + r.n + ' dans le viseur de ' + r.cn + ' ?', (r.src ? 'Selon nos informations, ' : 'D\'après un bruit insistant, ') + r.cn + ' suivrait de près ' + r.n + ' (' + r.pos + '). Du côté de ' + S.club.name + ', on ne commente pas.', 'hot'); }
}
/** Chaque semaine : les rumeurs arrivent à échéance (une vraie piste devient une offre), de nouvelles apparaissent. */
function rumorWeek() {
  S.rum = (S.rum || []).filter(r => {
    const p = r.mine ? pById(r.pid) : poolP(r.pid), t = teamByK(r.ck); if (!p || !t) return false;
    if (!r.mine && p.t === r.ck) return false;                               // le transfert annoncé a eu lieu
    if (--r.w > 0) return true;
    if (r.mine && r.real) {
      if (!mercato().open) { r.w = 1; return true; }
      if (!p.loan && S.players.length > 14 && !S.offers.some(o => o.id === p.id)) { S.offers.push({ id: p.id, amt: Math.round(value(p) * R(1, 1.3) / 1e4) * 1e4, n: 0, by: t.k }); notify('🔔', 'La rumeur se confirme : ' + t.name + ' fait une offre pour ' + p.n + '.'); }
    }
    return false;
  });
  if (S.rum.length >= 8 || rnd() > (mercato().open ? .4 : .15)) return;
  const known = id => S.rum.some(r => r.pid === id);
  if (rnd() < .45) {
    const c = S.players.filter(p => !p.loan && ovr(p) >= xiAvg() - 1 && !known(p.id)); if (!c.length) return;
    const p = pick(c), ts = allAI().filter(t => tStr(t) >= ovr(p) - 8); if (!ts.length) return; const t = pick(ts);
    rumAdd({ pid: p.id, n: p.n, pos: p.pos, ck: t.k, cn: t.name, mine: 1, real: rnd() < .6, w: RI(2, 4) });
    if (['amb', 'ego'].includes(chOf(p))) p.mo = clamp(mo(p) - 3, 0, 100);
    return;
  }
  const hot = allAI().filter(t => t.ai && t.ai.tgt && t.ai.tgt.ids && t.ai.tgt.ids.length);
  if (hot.length && rnd() < .7) { const t = pick(hot), p = poolP(t.ai.tgt.ids[0]); if (p && p.t !== t.k && !known(p.id)) rumAdd({ pid: p.id, n: p.n, pos: p.pos, ck: t.k, cn: t.name, real: 1, w: 3 }); return; }
  const c = S.pool.filter(p => p.t != null && ovr(p) >= 70 && !known(p.id)); if (!c.length) return;
  const p = pick(c), ts = allAI().filter(t => t.k !== p.t); if (ts.length) { const t = pick(ts); rumAdd({ pid: p.id, n: p.n, pos: p.pos, ck: t.k, cn: t.name, real: 0, w: RI(2, 4) }); }
}
function rumList() { return (S.rum || []).filter(r => r.mine ? pById(r.pid) : poolP(r.pid)); }
function rumHTML() {
  const l = rumList();
  return `<div class="panel"><h3>🗞️ Rumeurs de transfert <small>toutes ne sont pas fondées</small></h3>${l.length ? l.map(r => { const p = r.mine ? pById(r.pid) : poolP(r.pid), tm = r.mine ? null : teamOf(p); return `<div class="li"><span class="tag${r.src ? ' v' : ''}">${r.src ? 'Source fiable' : 'Bruit de couloir'}</span><span><button class="lnk" data-a="player" data-id="${p.id}">${esc(p.n)}</button> <small class="mut">${p.pos} · ${r.mine ? ovr(p) : seen(p).ov}</small><br><small class="mut">${r.mine ? esc(r.cn) + ' préparerait une offre pour votre joueur.' : esc(r.cn) + ' suit le joueur' + (tm ? ' de ' + esc(tm.name) : ', actuellement libre') + '.'}</small></span><span class="sp">${r.mine ? (p.loan || p.noRen === S.season || (p.req && mo(p) < 30) ? '<small class="mut">Refuse de discuter</small>' : `<button class="btn sm" data-a="renewM" data-id="${p.id}">Prolonger</button>`) : `<button class="btn sm gold" data-a="nego" data-id="${p.id}">Devancer</button>`}</span></div>`; }).join('') : '<div class="empty">Aucune rumeur pour le moment. Elles se multiplient pendant les mercatos.</div>'}
<p class="mut" style="margin-top:10px">Une rumeur fondée sur l'un de vos joueurs débouche sur une offre en quelques matchs. Si vous négociez un joueur suivi par un autre club, ce club devient votre concurrent : ne traînez pas.</p></div>`;
